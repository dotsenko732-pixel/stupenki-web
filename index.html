function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* нет вибрации */ } }
let toastTimer = null;

/* =============================================================
   СТУПЕНИ ПО МЕТОДИКЕ «Ступеньки: от первых букв до таблицы умножения»

  // Пока не было тренажёра для С4, они стояли на С4–С5; теперь на С4 — «До 100».

/* «Ч6 «Тексты»» — ступень коротко, для строк на главной, в тренажёрах и в настройках */
const stageLabel = st => `${st.code} «${st.name}»`;

/* =============================================================
   2. ДАННЫЕ И СОХРАНЕНИЕ
   Всё состояние — один объект S, сохраняется целиком одним ключом.
   В Claude — через хранилище артефакта (window.storage).
   В версии для телефона здесь будет хранилище на самом устройстве.
   ============================================================= */
const STORAGE_KEY = "stupenki-state-v1";
const DEFAULT_STATE = {
  childName: "", startDate: null,
  ladderStep: 0, ladderLog: [],          // [{d, step, mark: easy | hard | no}]
  span: { fwd: 3, bwd: 2 }, spanLog: [], // [{d, dir, len, ok}]
  muhaLen: 3, muhaPace: 1500, muhaLog: [],   // голосом: muhaLog: [{d, len, ok}]
  flyLevel: 1, flyLog: [], flyBest: 1,       // на экране: flyLog: [{d, lvl, ok}]
  stumbles: [], stumblesOff: [],             // запинки при чтении: [{d, w}] и убранные слова
  schulteSize: 3, schulteLog: [],        // [{d, size, sec, m}]
  probe: null, phonemeDaily: false,      // probe: последняя проверка звуков {d, errors}
  probes: [],                            // все проверки звуков: [{d, set: "А" | "Б" | "В", errors, wrong: [номера вопросов] | null}]
  soundOutStep: 1, soundOutLog: [],      // «Убери звук»: ступень 1 — первый звук, 2 — последний; [{d, w}] — показанные слова
  weekly: [],                            // [{d, wpm, schulte, fwd, bwd, step}]
  sessions: [],                          // [{d, done: [id блоков]}]
  notes: [],                             // [{d, what}]
  textsUsed: [], practiceUsed: [], practiceText: null,  // practiceText: {text, dates: []}
  practiceUsed2: [],                     // тексты второго уровня, которые уже брали
  practiceUsed3: [],                     // и третьего (с 1.5.0)
  mult: {},                              // таблица умножения (с 1.5.0): {"3x4": {s: дней с ответом с первого раза, d: последний день}}
  calc: {},                              // примеры «до 10» и «через десяток» (с 1.7.0, src/calc-facts.js): {"3+4": {s, d}, "7-3": {s, d}} — как mult
  div: {},                               // «Деление» (с 1.7.0, src/div-facts.js): {"12:3": {s, d}} — как mult; 12 : 3 и 12 : 4 — разные
  backupAt: null,                        // когда последний раз «Сохранить файлом» или загрузка из файла
  stage: { read: null, count: null },    // ступени по методике (src/stages.js): номер — выбрал родитель, null — по занятиям (rules.stageNow)
  stickers: [],                          // наклейки за тренажёры: [{d, id: какая, from: за какой тренажёр}], одна за тренажёр в день
  sound: true,                           // «дзынь» на детских экранах при успехе
  rounds: [],                            // итоги кругов новых тренажёров: [{d, t, ok, of, sec?}] (src/rounds.js)
  letters: {}                            // «Буквы» (с 1.7.0): {"М": {s: дней, когда нашёл с первого раза, d: последний день}} (src/overlays/letters.js)
  // Необязательные поля — в DEFAULT_STATE их нет, чтобы у тех, кто их не выбирал, сохранённое не менялось:
  // plan: "stages" | "program" — какое занятие (src/plan.js); нет поля — программа, как было всегда.
  // stageLater: {read: {n, d}, count: {n, d}} — «Пока рано» у подсказки о следующей ступени (src/next-stage.js)
  // check — входная проверка (src/check-data.js): {d, read, count}; поля нет, пока её не проходили
};
const clone = o => JSON.parse(JSON.stringify(o));
let S = clone(DEFAULT_STATE);

/* Где сохранять. Внутри Claude есть window.storage — берём его.
   На своём компьютере его нет, тогда пользуемся хранилищем браузера.
   Если и оно запрещено (приватное окно), работаем без сохранения. */
let store = "memory";
function detectStore() {
  if (window.storage && typeof window.storage.set === "function") return "claude";
  try {
    const probe = "stupenki-probe";
    window.localStorage.setItem(probe, "1");
    window.localStorage.removeItem(probe);
    return "local";
  } catch (e) { return "memory"; }
}
function storeLabel() {
  if (store === "claude") return "Сохраняется в Claude, в хранилище этого приложения.";
  if (store === "local") return "Сохраняется в этом браузере, на этом компьютере. Очистка данных сайтов в браузере всё сотрёт — раз в неделю жми «Сохранить файлом».";
  return "Сейчас НЕ сохраняется: браузер запретил хранение, бывает в приватном окне. Данные пропадут при закрытии вкладки.";
}
/* Данные старых версий — к нынешнему виду: недостающие поля по умолчанию, плюс переносы ниже.
   Поля только добавляются, старые не меняются. */
function fromData(data) {
  const s = Object.assign(clone(DEFAULT_STATE), data);
  // 1.2.0: история проверок звуков. Раньше была одна проверка — набор А, в s.probe.
  // Проверки, пройденные на бумаге, вносит сам родитель: «Внести проверку с бумаги» в блоке звуков
  if (s.probe && !s.probes.length) s.probes.push({ d: s.probe.d, set: "А", errors: s.probe.errors, wrong: null });
  // Ступени: номер в пределах лестницы — выбор родителя, всё прочее — null (определяется по занятиям).
  // Поля stage, которых эта версия не знает, остаются как были
  const st = s.stage && typeof s.stage === "object" && !Array.isArray(s.stage) ? s.stage : {};
  s.stage = Object.assign({ read: null, count: null }, st);
  for (const line of ["read", "count"]) {
    const n = s.stage[line];
    if (!(Number.isInteger(n) && n >= 0 && n < STAGES[line].length)) s.stage[line] = null;
  }
  if (!Array.isArray(s.stickers)) s.stickers = [];              // наклейки появились позже; чужой формат — с нуля
  if (!Array.isArray(s.rounds)) s.rounds = [];                  // итоги кругов (с 1.7.0); чужой формат — с нуля
  if (!s.calc || typeof s.calc !== "object" || Array.isArray(s.calc)) s.calc = {};   // факты примеров (с 1.7.0); чужой формат — с нуля
  if (!s.letters || typeof s.letters !== "object" || Array.isArray(s.letters)) s.letters = {};   // «Буквы» (с 1.7.0)
  if (!s.div || typeof s.div !== "object" || Array.isArray(s.div)) s.div = {};   // «Деление» (с 1.7.0); чужой формат — с нуля
  // Вид занятия (src/plan.js): только "stages" или "program", всё прочее — нет поля, то есть программа
  if (s.plan !== "stages" && s.plan !== "program") delete s.plan;
  if (!s.stageLater || typeof s.stageLater !== "object" || Array.isArray(s.stageLater)) delete s.stageLater;
  // Входная проверка (src/check-data.js): поле появляется только после неё — {d, read, count}; чужой формат — убрать
  if ("check" in s && !(s.check && typeof s.check === "object" && typeof s.check.d === "string")) delete s.check;
  return s;
}
function applyState(text) { S = fromData(JSON.parse(text)); }

async function loadState() {
  store = detectStore();
  try {
    if (store === "claude") { const r = await window.storage.get(STORAGE_KEY, false); if (r && r.value) applyState(r.value); }
    else if (store === "local") { const v = window.localStorage.getItem(STORAGE_KEY); if (v) applyState(v); }
  } catch (e) { /* ключа ещё нет — это первый запуск */ }
}
let saveTimer = null;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300); }
async function flush() {
  clearTimeout(saveTimer);
  try {
    const text = JSON.stringify(S);
    if (store === "claude") await window.storage.set(STORAGE_KEY, text, false);
    else if (store === "local") window.localStorage.setItem(STORAGE_KEY, text);
  } catch (e) { toast("Не удалось сохранить данные"); }
}
document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });
window.addEventListener("pagehide", flush);      // закрыли вкладку на ноутбуке — успеваем сохранить

/* Заменить состояние целиком: загрузка из файла и «Стереть все данные».
   Из других модулей написать S = … нельзя: импорт доступен только для чтения.
   А S, объявленный здесь через let, — «живая» ссылка: после замены все модули видят новый объект. */
function replaceState(next) { S = next; }

/* =============================================================
   3. ПОМОЩНИКИ: даты, случайность, склонения
   ============================================================= */

const pad = n => String(n).padStart(2, "0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const WEEKDAYS = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const humanDate = iso => { const d = parseISO(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const weekdayOf = iso => parseISO(iso).getDay();
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmt = sec => `${Math.floor(sec / 60)}:${pad(sec % 60)}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = n => Math.floor(Math.random() * n);
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}
const isWord = t => /[0-9A-Za-zА-Яа-яЁё]/.test(t);
function tokenize(text) {            // слова текста; тире приклеиваем к соседнему слову
  const out = [];
  for (const t of text.split(/\s+/).filter(Boolean)) {
    if (!isWord(t) && out.length) out[out.length - 1] += " " + t; else out.push(t);
  }
  return out;
}
const countWords = text => text.split(/\s+/).filter(isWord).length;

/* ---------- Примеры на сложение и вычитание (с 1.7.0) ----------
   Тренажёры «Примеры до 10» (k = 10) и «Через десяток» (k = 20) — src/overlays/calc.js.
   Пример — {a, b, op}: op "+" — это a + b, op "-" — a − b.
   Факт — пример без порядка слагаемых: 3 + 4 и 4 + 3 — один факт, ключ «3+4» (меньшее + большее);
   у вычитания ключи свои: «7-3». S.calc["3+4"] = {s, d} — как S.mult у таблицы умножения:
   s — в скольких разных днях он ответил с первого раза (не с первого — s − 1, не ниже нуля),
   d — последний день. Зелёный — s ≥ 2: вспоминает сразу в два разных дня.
   Засчитываются только ответы «В уме»: с рамкой он пересчитывает точки, а зелёный значит «помнит».

   Какие примеры где:

   Поровну делится всегда: N = k × q (остаток — после С8). Круг — 5 ходов по нарастающей:
   2 тарелки по 2–3, 3 тарелки по 2–3, 2 тарелки по 4–7, 4 тарелки по 3–5; последним — маленький:
   заканчиваем на удаче. Предметы в ходах разные (рисунки наклеек, src/count-art.js) */
const SHARE_PLAN = [[2, 2, 3], [3, 2, 3], [2, 4, 7], [4, 3, 5], [3, 2, 2]];
function shareTurns() {
  const kinds = shuffle(COUNT_THINGS);
  return SHARE_PLAN.map(([k, from, to], i) => { const q = from + rnd(to - from + 1); return { k, q, n: k * q, kind: kinds[i] }; });
}
/* Сколько на каждой: верный ответ и три рядом (от 1) */
function shareOptions(t) {
  const wrong = shuffle([t.q + 1, t.q - 1, t.q + 2, t.q - 2].filter(v => v >= 1)).slice(0, 3);
  for (let v = t.q + 3; wrong.length < 3; v++) if (!wrong.includes(v)) wrong.push(v);
  return shuffle([t.q, ...wrong]);
}
/* Можно ли положить на тарелку j: всем по одному — на ней не больше, чем на других */
const plateOpen = (plates, j) => plates[j] <= Math.min(...plates);

/* ---------- Деление: что он уже знает (с 1.7.0) ----------
   S.div["12:3"] = {s, d} — как S.mult у таблицы умножения: s — в скольких разных днях ответил
   с первого раза (не с первого или с подсказкой — s − 1, не ниже нуля), d — последний день.
   Зелёный — s ≥ 2: вспоминает сразу в два разных дня. Примеры и картинки — src/div-data.js. */
const divLevel = f => (S.div[divKey(f)] || { s: 0 }).s;
const divKnown = f => divLevel(f) >= 2;
const divKnownCount = () => DIV_FACTS.filter(divKnown).length;

/* Ответ: с первого раза — +1, но не чаще раза в день; не с первого — −1, не ниже нуля */
function divRecord(f, first) {
  const k = divKey(f), t = todayISO(), cur = S.div[k] || { s: 0, d: null };
  if (first && cur.d === t) return;                     // сегодня уже засчитан
  S.div[k] = { s: first ? cur.s + 1 : Math.max(0, cur.s - 1), d: t };
  save();
}

/* «Вперемешку», как в таблице умножения: всё, что уже встречалось, — сначала самое невыученное;
   не хватает до n — новые, сначала с делителем 2–5 */
function divMix(n = 10) {
  const seen = DIV_FACTS.filter(f => S.div[divKey(f)]).sort((x, y) => divLevel(x) - divLevel(y));
  const fresh = DIV_FACTS.filter(f => !S.div[divKey(f)]);
  return [...seen, ...fresh.filter(f => f.d <= 5), ...fresh.filter(f => f.d > 5)].slice(0, n);
}

/* Ступень счёта по делению — для rules.stageAuto. Деление на С8 идёт после всей таблицы умножения
   (С7: все 44 клетки зелёные), поэтому одного удачного ответа мало — это может быть и угадывание
   из четырёх. Есть зелёные примеры (с первого раза в два разных дня) — не ниже С8 */
function divFloor() {
  return DIV_FACTS.some(divKnown) ? { n: 8, why: "в «Делении» есть примеры, решённые с первого раза в два разных дня" } : null;
}

  // Тексты второго уровня — когда последний замер 35+ слов в минуту. По 50–70 слов,

  // С 1.5.0 их 20: вторая десятка — тоже со стечениями по нарастающей, в среднем чуть сложнее первой
  practiceTexts2: [
    "Летом Нина жила у бабушки в деревне. Утром она носила курам воду и зерно. Куры бегали за ней по двору. Потом Нина и бабушка ходили на речку. Там они мыли ноги и сидели на тёплом камне. Днём бабушка пекла пирог с малиной. Вечером Нина пила молоко и рано ложилась спать. Ей снились куры и речка.",
    "У нас живёт корова Зорька. Она большая и добрая. Каждое утро мама доит Зорьку, а я держу ведро. Молоко тёплое и пахнет травой. Потом я веду корову на луг. Там она ест траву до самого вечера. Вечером Зорька сама идёт домой. Она знает дорогу лучше меня. Я даю ей кусок хлеба с солью.",
    "Папа купил на рынке поросёнка. Он был розовый, с маленьким хвостиком. Мы сделали ему домик из досок и положили туда сено. Брат принёс старое корыто. Поросёнок много ел и быстро рос. Он любил копать землю носом. Однажды он убежал в огород и съел капусту. Мама долго ругалась, а потом смеялась. С тех пор мы закрываем калитку.",
    "Осенью мы пошли в лес за грибами. С собой взяли корзину и нож. В лесу было тихо и пахло листьями. Под берёзой брат нашёл крепкий белый гриб. Потом мы увидели целую семью лисичек. Я осторожно срезал их ножом. К обеду корзина стала тяжёлой. Дома мама почистила грибы и пожарила их с картошкой.",
    "Зимой дедушка расчищал снег во дворе. Он брал широкую лопату и работал до обеда. Я помогал ему маленькой лопаткой. Мы сделали дорожку от крыльца до сарая и до колодца. Потом слепили крепость из снега. Брат прятался за стеной и бросал снежки. Мы вернулись домой красные и весёлые. Бабушка налила нам горячего чая с вареньем.",
    "Весной на реке тронулся лёд. Большие льдины плыли мимо деревни и сталкивались с треском. Мы стояли на крутом берегу и смотрели. Вода поднялась и залила луг. Скоро прилетели утки и гуси. Они кричали и плескались в воде. Через две недели вода спала. На лугу выросла яркая трава, и стадо снова вышло пастись.",
    "Утром в сарае громко закричал петух. Я встал, быстро оделся и вышел во двор. Над крышей светило яркое солнце. Пёс Кузя прыгнул мне навстречу и завилял хвостом. Я насыпал курам зерна и заглянул в гнёзда. В соломе лежали три яйца. Я сложил их в корзинку и принёс маме. На завтрак мы сделали вкусную яичницу.",
    "В субботу мы строили скворечник. Папа достал доски, гвозди и пилу. Я держал доску, а папа пилил. Потом мы сбили стенки и крышу. Брат просверлил круглое окошко. Скворечник покрасили в зелёный цвет и повесили на высокую берёзу. Через неделю прилетели скворцы. Они громко свистели и носили в домик сухую траву. Скворцы весело хлопотали весь день.",
    "В ноябре стало холодно. Утром трава хрустела от инея. Лужи затянуло тонким прозрачным льдом. Дедушка достал из кладовки валенки и толстые рукавицы. Мы с братом сложили дрова в сарай и закрыли теплицу плёнкой. Скворцы и ласточки давно улетели. Остались только воробьи и синицы. Вечером в печке громко трещали сухие поленья. В избе было тепло и спокойно. Пахло свежим хлебом и сушёными травами.",
    "Летом мы с братом строили плот. Мы связали крепкой верёвкой пять толстых брёвен. Сверху прибили доски. Плот получился тяжёлый, но прочный. Мы столкнули его в пруд и забрались наверх. Папа стоял в прохладной воде у самого берега и крепко держал плот. Брат толкал плот длинной жердью. Я смотрел в прозрачную воду. Там плавали стайки мальков. К вечеру мы причалили к берегу, мокрые и счастливые.",
    "У нас в сарае живут перепела. Они маленькие, пёстрые и очень быстрые. Каждое утро я насыпаю им корм и наливаю свежую воду. Перепёлки несут крошечные пятнистые яйца. Я собираю их в лоток и считаю. Вчера было сорок штук! Мама варит яйца на завтрак, а часть мы продаём соседям. Перепела любят тишину, поэтому в сарае я хожу медленно.",
    "В субботу у моего велосипеда спустило колесо. Отец сказал, что пора учиться чинить самому. Мы перевернули велосипед и сняли колесо. Я достал камеру, подкачал её и опустил в таз с водой. Из маленькой дырочки побежали пузырьки. Мы зачистили это место шкуркой, намазали клеем и прижали заплатку. Потом накачали колесо насосом и поставили на место. Я гордился, что справился сам.",
    "Летом дядя взял меня на джайлоо. Это высокое пастбище в горах, где пасутся кони и овцы. Мы ехали верхом по узкой тропе. Мой конь шагал осторожно и фыркал. Наверху стояли белые юрты. Тётя угостила нас горячими боорсоками и кумысом. Вечером стало прохладно, и мы сидели у костра. Над горами светили яркие звёзды. Ночью я спал в юрте под тёплым одеялом.",
    "Ночью разыгралась сильная метель. Ветер свистел в трубе и стучал ставнями. К утру снег засыпал всю улицу, и машины застряли. Сосед завёл старый трактор и стал расчищать дорогу. Мы с братом взяли лопаты и откопали калитку. Снег был глубокий и тяжёлый. Щёки щипал крепкий мороз. Зато потом мама напекла блинов, а мы грелись у печки и пили сладкий чай с чабрецом.",
    "В июле в саду созрел урюк. Абрикосы висели крупные, оранжевые, с румяным боком. Мы расстелили под деревьями брезент. Папа залез на крепкую ветку и стал трясти. Спелые абрикосы застучали по брезенту. Мы с сестрой собирали их в вёдра. Часть мама пустила на джем, а остальные мы разрезали и разложили сушиться на крыше. Через две недели получилась сладкая курага.",
    "Перед Новым годом папа купил на базаре пушистую ёлку. Она пахла смолой и морозом. Мы поставили её в угол и стали наряжать. Сестра развесила блестящие шары, а я повесил гирлянду. Сверху мама прикрепила красную звезду. Вечером мы выключили свет и зажгли гирлянду. Ёлка засверкала разными огнями. Под ней лежали подарки в яркой бумаге. Мы ждали полночь и загадывали желания.",
    "Весной брат смастерил воздушного змея. Он склеил каркас из тонких реек и обтянул его цветной бумагой. Хвост сделали из верёвки и бантиков. В субботу мы вышли в поле. Дул сильный ветер. Брат побежал с катушкой, а я подбросил змея. Змей дёрнулся, взлетел и поплыл высоко над травой. Он кружил и шуршал. Мы смотрели на него, задрав головы, пока не стемнело.",
    "У дедушки на пасеке двадцать ульев. Летом пчёлы собирают нектар с цветов на склонах гор. Дедушка надевает сетку и перчатки, чтобы пчёлы не ужалили. Он осторожно достаёт рамки, полные мёда. Мы крутим медогонку, и густой мёд стекает в ведро. На кухне пахнет воском и цветами. Первую банку дедушка всегда отдаёт соседке, бабушке Айше. Так у нас принято.",
    "Бабушка печёт лепёшки в тандыре. Это глиняная печь во дворе. Сначала дедушка разжигает в ней дрова. Пока тандыр нагревается, бабушка замешивает тесто и раскатывает круглые лепёшки. Сверху она посыпает их кунжутом. Потом бабушка прилепляет лепёшки прямо к горячей стенке печи. Через десять минут они становятся румяными и хрустящими. Мы ждём у крыльца и вдыхаем сладкий запах свежего хлеба.",
    "В конце весны в аул приехали стригали. Овец загнали в просторный загон. Взрослые ловили их по одной и крепко держали. Стригаль быстро работал машинкой, и густая шерсть сползала толстым пластом. Остриженные овцы выглядели смешными и худенькими. Мы складывали шерсть в мешки. Бабушка отобрала самую чистую. Из неё она свяжет тёплые носки и рукавицы. К вечеру все устали, но были довольны."
  ],

  // Добавлено в 1.5.0: третий уровень — когда в замере 50+ верных слов в минуту и точность 95%+.
  // По 70–90 слов, длиннее и с сюжетом; стечения от первого текста к последнему всё чаще. По 3 дня на текст
  practiceTexts3: [
    "Вечером, когда стадо вернулось с пастбища, Азамат пересчитал овец. Одного ягнёнка не хватало. Солнце уже садилось, и в горах быстро темнело. Азамат взял фонарик и позвал пса Алабая. Они пошли по тропе вдоль ручья. Пёс бежал впереди и нюхал землю. Вдруг он остановился у кустов и залаял. Там, запутавшись в колючках, жалобно блеял ягнёнок. Азамат осторожно освободил его и понёс домой на руках. Дома мама сказала, что он поступил как настоящий пастух.",
    "Зимой мы с сестрой заметили, что речка замёрзла только сверху. Под прозрачным льдом бежала тёмная вода. Мы спросили папу, почему лёд не опускается на дно. Папа налил воды в пластиковую бутылку и поставил её в морозилку. Утром бутылка раздулась. Оказалось, когда вода замерзает, она расширяется, и лёд становится легче воды. Поэтому лёд всплывает и укрывает реку, как одеяло. Под ним рыбы спокойно зимуют в холодной, но жидкой воде. А если бы лёд тонул, реки промерзали бы до самого дна.",
    "В июне в горах начал таять снег, и речка возле нашего лагеря стала бурной. Утром мы должны были перейти её вброд. Инструктор натянул над водой крепкую верёвку и закрепил её на деревьях. Он строго объяснил правила: идти боком к течению, держаться за верёвку и не смотреть вниз на быструю воду. Вода была ледяная и доставала мне до колен. Ноги скользили по камням, но я держался крепко. На другом берегу мы развели костёр и сушили промокшие носки и ботинки.",
    "В августе папа решил научить нас ставить палатку. Мы поехали на берег горного озера. Сначала нужно было выбрать ровное место без камней и подальше от воды. Брат расстелил дно палатки, а я вставлял гибкие дуги в узкие рукава. Папа показал, как натягивать растяжки и вбивать колышки под наклоном, чтобы ветер не сорвал палатку. С третьей попытки у нас всё получилось. Ночью над озером поднялся сильный ветер, но палатка стояла крепко, и мы спокойно спали до утра.",
    "Утром после снегопада мы с дедушкой пошли в лес. Снег лежал ровный и чистый, как лист бумаги. Дедушка учил меня читать следы. Вот цепочка маленьких следов, один за другим — здесь пробежала лиса. А вот два длинных следа впереди и два коротких сзади — это заяц. Он прыгает так, что задние лапы оказываются впереди передних. У старой сосны мы нашли шишки, разгрызенные белкой. Домой я вернулся с красными щеками и рассказал всем, кто ночью гулял по лесу.",
    "В середине августа папа разбудил нас за полночь. Мы вынесли во двор одеяла и легли на спину. Небо было чёрное и глубокое, а звёзд — не сосчитать. Папа объяснил, что сегодня звездопад: Земля пролетает сквозь облако крошечных камешков, и они сгорают в воздухе яркими чёрточками. Первую падающую звезду заметила сестра. Потом их стало много, и мы перестали считать. Я загадал желание и никому его не рассказал, чтобы оно обязательно сбылось. А утром первым делом нарисовал звездопад в альбоме.",
    "Весной, в праздник Нооруз, соседки собрались варить сумолок. Это главное угощение весеннего праздника. Его готовят из пророщенной пшеницы целую ночь в огромном котле. Женщины по очереди мешали густую тёмную массу длинной деревянной лопаткой и пели песни. Нам, детям, разрешили бросить на дно котла чистые камешки, чтобы сумолок не пригорел. Говорят, кому достанется камешек в тарелке, тому весь год будет везти. Утром сумолок стал сладким и коричневым, и его раздавали всем соседям.",
    "Осенью в нашем ауле устроили ярмарку. Каждая семья принесла то, что вырастила или сделала сама. Бабушка выставила на стол банки с вареньем и мешочки с сушёными травами. Мы с братом продавали перепелиные яйца в маленьких коробках. Сначала покупатели проходили мимо, и мне стало грустно. Тогда брат придумал написать табличку: «Свежие яйца от весёлых перепёлок». Люди стали останавливаться и улыбаться. К обеду мы продали всё до последней коробки, а на вырученные деньги купили новую поилку для птиц.",
    "В соседнем селе живёт беркутчи — охотник с беркутом. Его птицу зовут Жолборс. У беркута острые когти, крепкий клюв и такое зрение, что он замечает зайца за два километра. Хозяин взял его ещё птенцом, кормил мясом и учил садиться на руку в толстой кожаной перчатке. На голову беркуту надевают колпачок, чтобы он не волновался. Осенью на празднике мы видели, как Жолборс стремительно взмыл вверх, сделал круг над полем и точно вернулся к хозяину.",
    "Летом мы поехали к Иссык-Кулю. Дорога шла через крутой высокогорный перевал. Машина медленно поднималась по узкому серпантину, а внизу оставались облака. На самой вершине папа остановился, и мы вышли. Воздух был холодный и разреженный, дышать стало труднее. Вокруг сверкали острые снежные пики. Потом начался спуск, и впереди открылось огромное синее озеро. Брат удивился, что противоположного берега почти не видно, как у моря. Вечером мы купались в прохладной прозрачной воде и смотрели, как солнце садится за горы."
  ],

/* Ответ на факт: с первого раза — +1, но не чаще раза в день; не с первого — −1, не ниже нуля */
function multRecord(a, b, first) {
  const k = multKey(a, b), t = todayISO(), cur = S.mult[k] || { s: 0, d: null };
  if (first && cur.d === t) return;                     // сегодня уже засчитан
  S.mult[k] = { s: first ? cur.s + 1 : Math.max(0, cur.s - 1), d: t };
  save();
}
/* «Вперемешку»: факты, которые уже встречались, сначала незнакомые; не хватает — из столбиков 2–5 */
function multMix(n = 10) {
  const seen = MULT_FACTS.filter(k => S.mult[k]).sort((x, y) => S.mult[x].s - S.mult[y].s);
  const easy = MULT_FACTS.filter(k => !S.mult[k] && Number(k.split("x")[0]) <= 5);
  return [...seen, ...easy].slice(0, n);
}

/* «До 100» (с 1.7.0): фактов нет, только круги — в уме был круг, где с первого раза хотя бы половина */
function hundredFloor() {
  return roundsOf("hundred-mind").some(r => r.of && r.ok * 2 >= r.of)
    ? { n: 4, why: "в «До 100» в уме уже был круг, где с первого раза получилась хотя бы половина" } : null;
}

/* ---------- Ступени по методике (src/stages.js, docs/metodika.md) ----------
   Ступень, которую родитель выбрал вручную (номер в S.stage.read или S.stage.count), — главная.
   Иначе она выводится из того, что уже есть в данных занятий:
   чтение — есть замер чтения или выбран текст для чтения → Ч6 «Тексты»; иначе были занятия
            с пройденным блоком чтения (слоговые таблицы программы) → Ч4 «Трудные слоги»;
            иначе в «Буквах» есть буквы, найденные с первого раза (S.letters, s ≥ 1) → Ч1 «Буквы»;
            иначе неизвестно — null. Новые тренажёры чтения (readFloor) дают «не ниже»:
            «Предложения» — Ч5 (она выше Ч4 и берёт верх над занятиями с чтением),
            «Слова и фразы» — Ч3, «Слоги из букв» — Ч2 (их перекрывают Ч4 и Ч6);
   счёт   — по ступени лестницы в блоке «Число» (LADDER_COUNT: 0 → С0, 1 и 2 → С1, 3 и 4 → С3);
            в таблице умножения есть зелёные клетки — не ниже С7, светлые — не ниже С6;
            в «Через десяток» в уме с первого раза — не ниже С3, в «Примерах до 10» — не ниже С2,
            кроме +1, −1 и пар до 5 и до 10: это ещё С1 (src/calc-facts.js, calcFloor);
            с 1.7.0: в «До 100» в уме был круг, где с первого раза хотя бы половина, — не ниже С4
            (фактов там не храним, только круги; один удачный пример из круга — мало: в круге есть и
            круглые десятки); в «Делении» есть зелёные примеры — не ниже С8 (src/div-facts.js, divFloor:
            деление идёт после всей таблицы, один удачный ответ из четырёх — ещё не знание).
   why — чем это объясняется, для строки в настройках */
/* Чтение по новым тренажёрам (S.rounds, src/rounds.js) — «не ниже», по образцу «Буквы → Ч1».
   Где отмечает родитель, хватает одного успеха: в «Слияние» слог прочитан слогом с первого раза — Ч2,
   в «Читаем слова» слово прочитано не по буквам — Ч3. Где ребёнок выбирает ответ, его можно угадать,
   поэтому нужен круг почти без промахов: «Прочитай и найди» — 8 из 10 с первого раза — Ч3,
   «Предложения» — все три ответа с первого раза — Ч5. «Найди слог» и «Фразы» ступень не поднимают. */
function readFloor() {
  const won = (t, ok) => roundsOf(t).some(r => r.ok >= ok);
  if (won("sentences", 3)) return { n: 5, why: "в «Предложениях» уже был текст с тремя верными ответами из трёх" };
  if (won("words3-read", 1) || won("words3", 8)) return { n: 3, why: "в «Словах и фразах» он уже читает слова" };
  if (won("merge", 1)) return { n: 2, why: "в «Слогах из букв» уже читал слогом с первого раза" };
  return null;
}
function stageAuto(line) {
  if (line === "read") {
    if (lastReadRow()) return { n: 6, why: "есть замер чтения" };
    // Выбран текст — Ч6; только в программе: по ступеням «Текст» открывают и на Ч5, и просто посмотреть
    if (S.plan !== "stages" && S.practiceText) return { n: 6, why: "выбран текст для чтения" };
    const floor = readFloor();
    if (floor && floor.n > 4) return floor;
    // Блок чтения программы (слоговые таблицы) — Ч4. Только в программе: в занятии по ступеням (src/plan.js)
    // блок чтения — «sread», а пятилетнему на Ч0–Ч1 Ч4 рано, даже если он когда-то открыл программу
    if (S.plan !== "stages" && S.sessions.some(x => x.done.includes("reading"))) return { n: 4, why: "были занятия с блоком чтения" };
    if (floor) return floor;
    if (Object.values(S.letters).some(x => x && x.s >= 1)) return { n: 1, why: "в «Буквах» уже есть буквы, найденные с первого раза" };
    return { n: null, why: "занятий с чтением ещё не было" };
  }
  const step = Math.min(Math.max(0, S.ladderStep || 0), LADDER_COUNT.length - 1), byLadder = LADDER_COUNT[step];
  const div = divFloor();
  if (div && byLadder < div.n) return div;
  const levels = MULT_FACTS.map(k => (S.mult[k] || { s: 0 }).s);
  if (byLadder < 7 && levels.some(s => s >= 2)) return { n: 7, why: "в таблице умножения есть зелёные клетки" };
  if (byLadder < 6 && levels.some(s => s >= 1)) return { n: 6, why: "в таблице умножения есть светлые клетки" };
  const hund = hundredFloor();
  if (hund && byLadder < hund.n) return hund;
  const calc = calcFloor();
  if (calc && byLadder < calc.n) return calc;
  return { n: byLadder, why: `лестница по числу — ступень ${step} «${PROGRAM.ladder.steps[step].name}»` };
}
const stageManual = line => Number.isInteger(S.stage[line]);
const stageNow = line => (stageManual(line) ? S.stage[line] : stageAuto(line).n);
/* Ступень лестницы целиком ({n, code, name, about, next}) или null, если неизвестна */
const stageOf = line => { const n = stageNow(line); return n === null ? null : STAGES[line][n]; };
/* Обе ступени известны — тогда тренажёры делятся на «Сейчас подходят» и «Все тренажёры» */
const stagesKnown = () => stageNow("read") !== null && stageNow("count") !== null;
/* Тренажёр подходит нынешней ступени (src/stages.js, STAGE_TRAINERS). «Убери звук» — и выше Ч3,
   пока в последней проверке звуков ошибки на «убери звук»: тогда эта игра нужна каждый день */
function trainerFits(id) {
  if (id === "soundOut" && outFocus()) return true;
  const t = STAGE_TRAINERS.find(x => x.id === id), n = t ? stageNow(t.line) : null;
  return n !== null && n >= t.from && n <= t.to;
}

const totalMinutes = () => PROGRAM.blocks.reduce((s, b) => s + b.minutes, 0);

const fullDay = iso => S.sessions.some(x => x.d === iso && x.done.length >= 4);
function dayStreak() {
  let n = 0, day = todayISO();
  if (!fullDay(day)) day = addDays(day, -1);
  while (day >= S.startDate) {
    if (weekdayOf(day) === 0) { day = addDays(day, -1); continue; }   // воскресенье цепочку не рвёт
    if (!fullDay(day)) break;
    n++; day = addDays(day, -1);
  }
  return n;
}

   скруглённые линии, зелёный и жёлтый из токенов. Без анимации. */

const VIEW = 'viewBox="0 0 200 1040" focusable="false"';

/* Пятиконечная звёздочка вокруг (cx, cy) */
function star(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = Math.PI / 5 * i - Math.PI / 2, k = i % 2 ? r * 0.48 : r;
    pts.push(`${(cx + k * Math.cos(a)).toFixed(1)} ${(cy + k * Math.sin(a)).toFixed(1)}`);
  }
  return `<path class="mks" d="M${pts.join(" L")} Z"/>`;
}

/* Росток недели: n полностью проведённых занятий — n листьев, за 6 из 6 — цветок.
   Растёт снизу из горшка; с понедельника — заново, как полоска недели на главной. */
function sprout(n) {
  const leaves = Math.max(0, Math.min(6, n)), base = 968, step = 64;
  const top = base - 44 - leaves * step;                       // верх стебля
  let stem = `M100 ${base}`;
  for (let y = base, i = 0; y > top; y -= 32, i++) stem += ` Q${i % 2 ? 105 : 95} ${y - 16} 100 ${Math.max(top, y - 32)}`;
  const leaf = i => {
    const y = base - 50 - i * step, s = i % 2 ? 1 : -1, x = k => 100 + s * k;
    return `<path class="sf" d="M100 ${y} Q${x(20)} ${y - 36} ${x(56)} ${y - 26} Q${x(34)} ${y + 4} 100 ${y} Z"/>
  <path class="ln" stroke-width="3.5" d="M${x(5)} ${y - 4} Q${x(26)} ${y - 18} ${x(46)} ${y - 24}"/>`;
  };
  const c = top - 26;                                          // середина цветка
  const crown = leaves === 6
    ? [0, 60, 120, 180, 240, 300].map(a => `<ellipse class="mks" cx="100" cy="${c - 19}" rx="11" ry="17" transform="rotate(${a} 100 ${c})"/>`).join("") + `<circle class="dt" cx="100" cy="${c}" r="10"/>`
    : `<ellipse class="sf" cx="100" cy="${top - 7}" rx="7" ry="10"/>`;
  return `<svg ${VIEW} preserveAspectRatio="xMidYMax meet" data-leaves="${leaves}">
  <path class="ln" d="${stem}"/>
  ${Array.from({ length: leaves }, (_, i) => leaf(i)).join("\n  ")}
  ${crown}
  <path class="sf" d="M58 968 H142 L132 1022 H68 Z"/>
  <path class="ln" d="M50 968 H150"/>
</svg>`;
}

/* ---------- Лестница, нарисованная по клеткам ---------- */
function staircase(current) {
  const u = 22, W = 2 * u, n = PROGRAM.ladder.steps.length;
  const width = n * W + u, height = (n + 1) * u + 8;
  let out = "";
  for (let i = 0; i < n; i++) {
    const x = u / 2 + i * W, yBase = height - u / 2 - i * u, yTop = yBase - u;
    const cls = i < current ? "passed" : i === current ? "current" : "ahead";
    out += `<path class="${cls}" d="M${x} ${yBase}V${yTop}H${x + W}"/>`;
    out += `<text class="${cls}" x="${x + W / 2}" y="${yTop + 16}">${i}</text>`;
    if (i === current) out += `<circle cx="${x + W / 2}" cy="${yTop}" r="5.5"/>`;
  }
  return `<svg class="stairs" viewBox="0 0 ${width} ${height}" role="img" aria-label="Лестница по числу: ступень ${current} из ${n - 1}">${out}</svg>`;
}

function figureSVG(moves, k) {                 // образец фигуры для графического диктанта
  const pts = [[0, 0]]; let x = 0, y = 0;
  for (const [dir, n] of moves) {
    if (dir === "up") y -= n;
    if (dir === "down") y += n;
    if (dir === "left") x -= n;
    if (dir === "right") x += n;
    pts.push([x, y]);
  }
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), u = 18;
  const minX = Math.min(...xs), minY = Math.min(...ys);
  const w = (Math.max(...xs) - minX + 2) * u, h = (Math.max(...ys) - minY + 2) * u;
  const P = pts.map(([px, py]) => [(px - minX + 1) * u, (py - minY + 1) * u]);
  return `<svg class="fig" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Образец фигуры">
    <defs><pattern id="gp${k}" width="${u}" height="${u}" patternUnits="userSpaceOnUse"><path d="M${u} 0H0V${u}" fill="none" stroke="#DCE5F2"/></pattern></defs>
    <rect width="${w}" height="${h}" fill="url(#gp${k})"/>
    <polyline points="${P.map(p => p.join(",")).join(" ")}" fill="none" stroke="#2340B8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${P[0][0]}" cy="${P[0][1]}" r="4" fill="#E7686D"/>
  </svg>`;
}

/* =============================================================
   4. ТАЙМЕРЫ
   Считаем от реального времени (Date.now), а не по тикам —
   так таймер не «уплывает», даже если телефон притормозил.
   ============================================================= */
class Countdown {
  constructor(paint, onDone) { this.paint = paint; this.onDone = onDone; this.total = 0; this.left = 0; this.id = null; }
  get running() { return this.id !== null; }
  set(sec) { this.stop(); this.total = sec; this.left = sec; this.paint(this); }
  start() {
    if (this.running || this.left <= 0) return;
    const t0 = Date.now(), from = this.left;
    this.id = setInterval(() => {
      const left = Math.max(0, from - Math.floor((Date.now() - t0) / 1000));
      if (left !== this.left) { this.left = left; this.paint(this); }
      if (left === 0) { this.stop(); if (this.onDone) this.onDone(); }
    }, 200);
    this.paint(this);
  }
  stop() { if (this.id !== null) { clearInterval(this.id); this.id = null; } this.paint(this); }
  toggle() { if (this.running) this.stop(); else this.start(); }
}

/* «Пока рано»: не показывать, пока признак не выполнится на более позднем дне */
function stageLater(line, n, d) {
  S.stageLater = Object.assign({}, S.stageLater, { [line]: { n, d } });
  save();
}

/* ---------- Итог занятия: что конкретно похвалить ---------- */
function doneView() {
  const lines = praiseLines(), t = todayISO();
  return `
  <h1 class="hand">Занятие проведено</h1>
  <svg class="stamp" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52"/><path d="M34 62l18 18 36-40"/></svg>
  <p class="sub">На этой неделе: ${sessionsThisWeek()} из 6.${dayStreak() > 1 ? ` Подряд: ${dayStreak()} ${plural(dayStreak(), "день", "дня", "дней")}.` : ""}</p>
  ${weekStrip()}
  <section class="part">
    <h2 class="hand">Что сказать после занятия</h2>
    ${lines.length ? `<ul class="praise">${lines.map(l => `<li>${l}</li>`).join("")}</ul>` : `<p>Назови одну конкретную вещь, которая сегодня получилась лучше, чем раньше.</p>`}
    <p class="hint">Хвалим за динамику и конкретно, без сравнений с другими детьми — только с ним самим вчера.</p>
  </section>${nextHintsHTML()}
  ${weekdayOf(t) === 6 && !weekRow(t) ? `<button class="btn primary big" data-act="go" data-to="weekly">Сделать замер недели</button>` : ""}
  <button class="btn big" data-act="go" data-to="home">На главную</button>`;
}

function praiseLines() {
  const t = todayISO(), out = [];
  const runs = schulteRuns(S.schulteSize), todayRuns = runs.filter(x => x.d === t), before = runs.filter(x => x.d < t);
  if (todayRuns.length && before.length) {
    const best = Math.min(...todayRuns.map(x => x.sec));
    const prevDay = before[before.length - 1].d;
    const prevBest = Math.min(...before.filter(x => x.d === prevDay).map(x => x.sec));
    if (best < prevBest) out.push(`«В прошлый раз Шульте была ${prevBest} ${plural(prevBest, "секунда", "секунды", "секунд")}, сегодня ${best}».`);
  }
  const lm = S.ladderLog.find(x => x.d === t && x.mark === "easy");
  if (lm) {
    const s = lm.step === S.ladderStep ? ladderStreak() : 1;
    out.push(`«Ступенька ${lm.step} сегодня далась легко${s > 1 ? `, уже ${s}-й раз подряд` : ""}».`);
  }
  for (const dir of ["fwd", "bwd"]) {
    const m = S.spanLog.find(x => x.d === t && x.dir === dir && x.ok);
    if (m) out.push(`«${m.len} ${plural(m.len, "цифру", "цифры", "цифр")} ${dir === "fwd" ? "повторил" : "повторил наоборот"} без единой ошибки».`);
  }
  return out;
}

/* =============================================================
   ЗАНЯТИЕ ДНЯ ПО СТУПЕНЯМ — для любого ребёнка (docs/metodika.md)
   Два вида занятия (S.plan):
   · «program» — программа Мирона: четыре блока PROGRAM.blocks, как было всегда;
   · «stages»  — по ступеням: разминка, чтение по ступени чтения, счёт по ступени счёта,
     «Внимание и память». 5 + 8 + 8 + 4 = 25 минут.
   Признак: поля plan нет (все данные до этой версии, резервные копии, история Мирона) — программа;
   новая семья после знакомства — по ступеням. Выбор — в настройках (ACT.setPlan).
   В DEFAULT_STATE поля нет нарочно: у тех, кто его не выбирал, сохранённое состояние не меняется.

   Какой тренажёр ступени сегодня: у каждой ступени свой короткий круг (DAY) — главный тренажёр
   ступени чаще, соседние реже; день круга — номер занятия (rules.sessionIndex: сколько дней
   с занятиями было до сегодня). Тренажёр, которому сегодня не из чего складывать (слоги без
   выученной согласной, слова, пока их меньше четырёх), пропускается — берётся следующий по кругу.
   Блок отмечается сам, когда закончен круг любого тренажёра этой лестницы, открытого из блока
   (overlays/kids.finished → planRound); «Блок готов, дальше» по-прежнему отмечает его вручную.
   ============================================================= */

const isStagesPlan = () => S.plan === "stages";

/* Блоки занятия по ступеням: id в S.sessions[].done. Чтение — «sread», не «reading»:
   «reading» — блок программы, по нему rules.stageAuto ставит Ч4 (слоговые таблицы) */
const STAGE_BLOCKS = [
  { id: "warmup", title: "Разминка: тело и глаза", minutes: 5 },
  { id: "sread", line: "read", title: "Чтение", minutes: 8 },
  { id: "scount", line: "count", title: "Счёт", minutes: 8 },
  { id: "focus", title: "Внимание и память", minutes: 4 }
];
const stageMinutes = () => STAGE_BLOCKS.reduce((s, b) => s + b.minutes, 0);

/* Тренажёры: какая кнопка открывает (act и data — как у карточек в screens/trainers.js),
   name — для родителя, from — как тренажёр подписывает наклейку (src/rewards.js) */
const TRAINERS = {
  sounds: { act: "openSounds", name: "Звуки", from: ["sounds"] },
  letters: { act: "openLetters", name: "Буквы", from: ["letters"] },
  merge: { act: "openMerge", name: "Слоги из букв", from: ["merge"] },
  words3: { act: "openWordsPhrases", name: "Слова и фразы", from: ["words3"] },
  soundOut: { act: "openSoundOut", name: "Убери звук", from: ["out"] },
  syl2: { act: "openSyl", data: { t: "t2" }, name: "Слоги 2: стечения согласных", from: ["syl-t2"] },
  syl3: { act: "openSyl", data: { t: "t3" }, name: "Слоги 3: шипящие и ц", from: ["syl-t3"] },
  syl4: { act: "openSyl", data: { t: "t4" }, name: "Слоги 4: шипящие в сочетаниях", from: ["syl-t4"] },
  syl5: { act: "openSyl", data: { t: "t5" }, name: "Слоги 5: й, ь, ъ", from: ["syl-t5"] },
  sentences: { act: "openSentences", name: "Предложения", from: ["sentences"] },
  text: { act: "openText", data: { mode: "read" }, name: "Текст", from: ["text"] },
  count: { act: "openCount", name: "Посчитай", from: ["count"] },
  dots: { act: "openDots", name: "Сколько точек?", from: ["dots"] },
  hidden: { act: "openHidden", name: "Сколько в кулаке?", from: ["hidden"] },
  calc10: { act: "openCalc", data: { k: 10 }, name: "Примеры до 10", from: ["calc10"] },
  tasks: { act: "openTasks", name: "Сколько стало?", from: ["tasks"] },
  calc20: { act: "openCalc", data: { k: 20 }, name: "Через десяток", from: ["calc20"] },
  hundred: { act: "openHundred", name: "До 100", from: ["hundred"] },
  chain: { act: "openChain", name: "Цепочки", from: ["chain"] },
  pairs: { act: "openPairs", name: "Пары", from: ["pairs"] },
  mult: { act: "openMult", name: "Таблица умножения", from: ["mult"] },
  division: { act: "openDiv", name: "Деление", from: ["div"] }
};

/* Круг дней по ступеням: номер — ступень. Главный тренажёр ступени стоит чаще */
const DAY = {
  read: [
    ["sounds", "sounds", "soundOut"],                 // Ч0: первый звук — признак перехода
    ["letters", "merge", "letters", "sounds"],        // Ч1: буквы; слоги — как только есть согласная
    ["merge", "letters", "merge", "words3"],          // Ч2: слияние, буквы идут дальше
    ["words3", "merge", "words3", "letters"],         // Ч3: слова и фразы
    ["syl2", "syl3", "syl4", "syl5"],                 // Ч4: таблицы трудных слогов
    ["sentences", "text", "sentences", "syl5"],       // Ч5: предложения с вопросами
    ["text"],                                         // Ч6: тексты
    ["text"]                                          // Ч7: длинные тексты
  ],
  count: [
    ["count", "count", "dots"],                       // С0: предметы до 10, точки сразу
    ["calc10", "hidden", "calc10", "dots"],           // С1: пары до 5 и до 10, состав числа
    ["calc10", "tasks", "calc10", "hidden"],          // С2: до 10 в уме, задачи
    ["calc20"],                                       // С3: через десяток
    ["hundred", "hundred", "calc20"],                 // С4: до 100
    ["chain", "pairs"],                               // С5: группами
    ["mult", "chain"],                                // С6: смысл умножения
    ["mult"],                                         // С7: таблица
    ["division", "mult"]                              // С8: деление
  ]
};

/* Есть ли сегодня из чего складывать (без Math.random: генераторы кругов здесь не зовём) */
function trainerReady(id) {
  if (id === "merge") return lettersReady(readLetters());
  if (id === "words3") { const l = readLetters(); return lettersReady(l) && picWordsFor(l.list).length >= MIN_WORDS; }
  return true;
}

/* Тренажёры ступени: сегодняшний первым, дальше остальные из её круга (без повторов) */
function lineTrainers(line) {
  const n = stageNow(line);
  if (n === null) return [];
  const list = DAY[line][n], k = sessionIndex();
  const order = list.map((_, i) => list[(k + i) % list.length]);
  const ready = [...new Set(order)].filter(trainerReady);
  return ready.length ? ready : [...new Set(order)].slice(0, 1);
}
const dayTrainer = line => lineTrainers(line)[0] || null;

/* Что делать без экрана — коротко для родителя, по ступени */
const OFFSCREEN = {
  read: [
    "Игра «Я вижу…»: «Я вижу то, что начинается на „м-м-м“». Звук тяни, букву не называй. Слоги — хлопками: «ма-ши-на».",
    "Букву с экрана найдите в книжке, на коробке, вылепите из пластилина. Называйте звуком: «м», не «эм».",
    "Сложите слог из двух карточек и протяните: «м-м-ма». Тянущиеся согласные — тянем, взрывные — одним толчком: «ка».",
    "Подпишите три вещи дома карточками: «кот», «сок», «дом». Пусть найдёт и прочитает.",
    "Перечитайте строчку слоговой таблицы, где были запинки, — ещё раз, без спешки.",

  ],
  count: [

    "Пять пальцев: сколько согнул, сколько осталось? Десять камешков — в две ладони, все способы.",

    "8 + 5: сначала до десяти (8 + 2), потом остаток (+ 3). Рамка-десятка — из коробки от яиц.",

    "Один столбик таблицы вслух вперемешку. Что забыл — ряды точек на бумаге.",
    "Разделите конфеты поровну на троих: всем по одной, по кругу. Сколько у каждого?"
  ]
};

/* Круг тренажёра закончен (from — как у наклеек). Идёт занятие по ступеням — отметить блок
   этой лестницы, если тренажёр из её круга на сегодня. Возвращает id отмеченного блока или null */
function planRound(from) {
  const t = todayISO();
  for (const b of STAGE_BLOCKS) {
    if (b.id === "warmup") continue;                       // разминку отмечает родитель
    const froms = b.line ? lineTrainers(b.line).flatMap(id => TRAINERS[id].from) : ["schulte", "fly"];
    if (!froms.includes(from)) continue;
    let rec = todayRecord();
    if (!rec) { rec = { d: t, done: [] }; S.sessions.push(rec); }
    if (!rec.done.includes(b.id)) { rec.done.push(b.id); save(); }
    return b.id;
  }
  return null;
}

/* Ступень строки «Чтение · Ч2 «Слияние»» — или null */
const stageAt = line => { const n = stageNow(line); return n === null ? null : STAGES[line][n]; };

/* ---------- Занятие по ступеням (src/plan.js): главная, четыре блока, выбор в настройках ---------- */

const LINE = { read: "чтения", count: "счёта" };
const doneToday = id => { const rec = todayRecord(); return !!rec && rec.done.includes(id); };

/* Кнопка тренажёра: те же data-act и data-*, что у карточки в «Тренажёрах» */
function trainerBtn(id, cls, label) {
  const t = TRAINERS[id], data = Object.entries(t.data || {}).map(([k, v]) => ` data-${k}="${v}"`).join("");
  return `<button class="btn ${cls}" data-act="${t.act}"${data}>${label || t.name}</button>`;
}

/* Название блока для плана на главной: «Чтение: Буквы» */
function blockTitle(b) {
  if (!b.line) return b.title;
  const id = lineTrainers(b.line)[0];
  return id ? `${b.title}: ${TRAINERS[id].name}` : `${b.title}: выбрать ступень`;
}

/* ---------- Главная ---------- */
function homeStages(backup, stageLine, offer = "") {   // offer — плашка входной проверки (check.js), если она сейчас нужна
  const t = todayISO(), wd = weekdayOf(t), rec = todayRecord(), done = rec ? rec.done : [], allDone = done.length >= 4;
  return `
  <h1 class="hand">${cap(WEEKDAYS[wd])}, ${humanDate(t)}</h1>
  <p class="sub">${allDone ? "Занятие проведено." : `Занятие по ступеням на ${stageMinutes()} минут.`}</p>
  ${weekStrip()}${offer}
  ${dayStreak() > 1 ? `<p class="streak">${dayStreak()} ${plural(dayStreak(), "день", "дня", "дней")} подряд</p>` : ""}
  <ol class="plan">
    ${STAGE_BLOCKS.map((b, i) => {
      const ok = done.includes(b.id);
      return `<li class="${ok ? "done" : ""}"><span class="mark" aria-hidden="true">${ok ? CHECK : i + 1}</span><span class="t">${blockTitle(b)}</span><span class="min">${b.minutes} мин</span></li>`;
    }).join("")}
  </ol>
  <button class="btn primary big" data-act="startSession">${allDone ? "Открыть занятие ещё раз" : done.length ? "Продолжить занятие" : "Начать занятие"}</button>
  ${nextHintsHTML()}${backup}
  ${stageLine}
  <button class="btn big" data-act="go" data-to="trainers">Тренажёры</button>
  <nav class="tools" aria-label="Разделы">
    <button class="btn" data-act="go" data-to="weekly">Замер недели</button>
    <button class="btn" data-act="go" data-to="progress">Прогресс</button>
    <button class="btn" data-act="go" data-to="notes">Для специалиста</button>
    <button class="btn" data-act="go" data-to="settings">Настройки</button>
  </nav>`;
}

/* ---------- Блоки ---------- */
/* Разминка: два упражнения для тела по кругу и слежение за ручкой — подходят любому ребёнку */
function warmupPart() {
  const pairs = [[0, 1], [2, 3], [4, 5]], [a, b] = pairs[sessionIndex() % 3];
  return `<section class="part">
    <h2 class="hand">Тело: два упражнения</h2>
    ${exItem(PROGRAM.body[a])}${exItem(PROGRAM.body[b])}
  </section>
  <section class="part">
    <h2 class="hand">Глаза</h2>
    ${exItem(PROGRAM.eyes.pen, miniBtn("mini-pen", 60, "Таймер на 1 минуту"))}
  </section>`;
}

/* Ступень неизвестна — выбрать прямо здесь (те же кнопки, что в настройках) */
function pickStage(line) {
  return `<section class="part">
    <h2 class="hand">Ступень ${LINE[line]} пока не выбрана</h2>
    <p class="hint">Выбери, с чего начать: по ступени будет тренажёр на сегодня. Не уверен — возьми ступень пониже: лёгкое начало лучше трудного.</p>
    <div class="stage-list">${STAGES[line].map(x => `<button class="btn stage-opt" data-act="stageSet" data-line="${line}" data-n="${x.n}"><b>${x.code} ${x.name}</b><small>${x.about}</small></button>`).join("")}</div>
  </section>`;
}

/* Чтение или счёт: тренажёр ступени на сегодня, другие тренажёры ступени и что делать без экрана */
function linePart(b) {
  const st = stageAt(b.line);
  if (!st) return pickStage(b.line);
  const [today, ...rest] = lineTrainers(b.line), done = doneToday(b.id);
  return `<section class="part">
    <h2 class="hand">${stageLabel(st)}</h2>
    <p class="hint">Осваиваем: ${st.about}. Дальше — когда ${st.next}.</p>
    <h3>На экране сегодня: ${TRAINERS[today].name}</h3>
    <div class="tool-row">${trainerBtn(today, done ? "" : "primary", `Открыть «${TRAINERS[today].name}»`)}</div>
    ${done ? `<p class="green">Блок отмечен — можно дальше.</p>` : `<p class="hint">Один круг — и блок отмечается сам. Закрыть экран можно в любой момент.</p>`}
    ${rest.length ? `<p class="hint">Не идёт или уже сделали — другой тренажёр этой ступени:</p><div class="tool-row">${rest.map(id => trainerBtn(id, "small")).join("")}</div>` : ""}
    <h3>Без экрана</h3>
    <p>${OFFSCREEN[b.line][st.n]}</p>
  </section>`;
}

/* Внимание и память: Шульте своего размера или Муха — по очереди, до пяти минут */
function focusPart() {
  const fly = sessionIndex() % 2 === 1, last = lastSchulte(S.schulteSize), done = doneToday("focus");
  const sch = `<button class="btn ${!fly && !done ? "primary" : ""}" data-act="openSchulte" data-size="${S.schulteSize}">Шульте ${S.schulteSize}×${S.schulteSize}</button>`;
  const mu = `<button class="btn ${fly && !done ? "primary" : ""}" data-act="openFly">Муха: уровень ${S.flyLevel}</button>`;
  return `<section class="part">
    <h2 class="hand">Сегодня: ${fly ? "Муха" : "Шульте"}</h2>
    <p class="hint">До пяти минут, по желанию: внимание и память — не вместо чтения и счёта.</p>
    <div class="tool-row">${fly ? mu + sch : sch + mu}</div>
    ${done ? `<p class="green">Блок отмечен — можно дальше.</p>` : ""}
    <p class="hint">${fly ? `Муха: ${flyLevel().about}.` : last ? `Шульте: последний раз ${last.sec} с, ${humanDate(last.d)}.` : "Шульте: найти числа по порядку, показывая пальцем."}</p>
  </section>`;
}

/* ---------- Экран занятия ---------- */
function stagesSessionView() {
  const i = ui.session.idx, b = STAGE_BLOCKS[i];
  const body = b.id === "warmup" ? warmupPart() : b.id === "focus" ? focusPart() : linePart(b);
  return `
  <div class="topbar">
    <button class="btn ghost" data-act="go" data-to="home">Главная</button>
    <span class="of">Блок ${i + 1} из 4</span>
    <button id="timer" class="timer" data-act="timerToggle"></button>
  </div>
  <h1 class="hand">${b.title}</h1>
  <p class="sub">${b.minutes} ${plural(b.minutes, "минута", "минуты", "минут")} по таймеру. Запусти его, когда начнёте.</p>
  ${body}
  <div class="block-nav">
    ${i > 0 ? `<button class="btn" data-act="prevBlock">Назад</button>` : `<button class="btn" data-act="go" data-to="trainers">Тренажёры</button>`}
    <button class="btn primary grow" data-act="blockDone">${i < 3 ? "Блок готов, дальше" : "Закончить занятие"}</button>
  </div>`;
}

/* ---------- Настройки: какое занятие ---------- */
function planPart() {
  const st = S.plan === "stages";
  return `<section class="part" id="plan">
    <h2 class="hand">Занятие</h2>
    <div class="stage-list">
      <button class="btn stage-opt ${st ? "picked" : ""}" data-act="setPlan" data-v="stages" aria-pressed="${st}"><b>По ступеням</b><small>${stageMinutes()} минут: разминка, тренажёр ступени чтения, тренажёр ступени счёта, внимание и память</small></button>
      <button class="btn stage-opt ${st ? "" : "picked"}" data-act="setPlan" data-v="program" aria-pressed="${!st}"><b>По программе</b><small>30–35 минут: разминка, слоговые таблицы и тексты, лестница по числу, пятиминутка</small></button>
    </div>
    <p class="hint">История занятий, серия дней и ступени сохраняются при любом выборе.</p>
  </section>`;
}

/* ---------- Первый запуск ---------- */
function onboarding() {
  return `
  <h1 class="hand big">Ступеньки</h1>
  <p class="lead">Домашние занятия с ребёнком 5–9 лет: чтение и счёт по ступеням — от первых звуков до таблицы умножения. Каждый день — 25 минут: ты ведёшь, ребёнок играет на своём экране.</p>
  ${staircase(0)}
  <label class="field"><span>Как зовут ребёнка</span><input type="text" id="nameInput" autocomplete="off" placeholder="Имя"></label>
  <button class="btn primary big" data-act="onboard">Начать</button>
  <p class="hint">Дальше предложим входную проверку на 10–15 минут — узнаем, с какой ступени начать. Всё хранится только на этом устройстве, в интернет ничего не уходит.</p>
  <section class="part">
    <h2 class="hand">Уже занимались?</h2>
    <p class="hint">На другом компьютере, в другом браузере или до переустановки — загрузи резервную копию, файл stupenki-….json. Вернётся вся история: замеры, ступени, проверки звуков.</p>
    <button class="btn" data-act="pickFile">Загрузить из файла</button>
