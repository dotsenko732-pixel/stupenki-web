}

/* Резервная копия: больше 7 дней без «Сохранить файлом» — жёлтая плашка с кнопкой в настройки.
   Копии не было — считаем от начала программы */
function backupCallout(t) {
  const days = daysBetween(S.backupAt || S.startDate, t);
  if (days <= 7) return "";
  const when = S.backupAt ? `Резервная копия была ${humanDate(S.backupAt)} — ${days} ${plural(days, "день", "дня", "дней")} назад.` : "Резервной копии ещё не было.";
  return `<div class="callout"><p>${when} Сохрани файл с историей занятий: Настройки → «Сохранить файлом».</p><button class="btn primary" data-act="go" data-to="settings">В настройки</button></div>`;
}

/* Ступени по методике одной строкой — со ссылкой в настройки, где их выбирают */
function stageLine() {
  const read = stageOf("read"), count = stageOf("count");
  const part = (what, st) => `${what} — ${st ? stageLabel(st) : "ступень пока не определена"}`;
  return `<p class="stage-line">${part("Чтение", read)}, ${part("счёт", count)}. <button class="link" data-act="go" data-to="settings">${read && count ? "Изменить" : "Выбрать"}</button></p>`;
}

/* ---------- Главная ---------- */
function home() {
  if (isStagesPlan()) return homeStages(backupCallout(todayISO()), stageLine(), checkOffer() ? checkCallout() : "");   // занятие по ступеням (src/plan.js)
  const t = todayISO(), wd = weekdayOf(t), type = fiveType(t);
  const rec = todayRecord(), done = rec ? rec.done : [], allDone = done.length >= 4;
  const step = PROGRAM.ladder.steps[S.ladderStep], streak = ladderStreak();
  const lastS = lastSchulte(S.schulteSize);
  const weekRowDone = !!weekRow(t);                      // замер этой недели уже есть — в субботу не напоминаем
  const cta = wd === 0 && !rec
    ? `<p class="lead">Воскресенье — по программе выходной.</p><button class="btn big" data-act="startSession">Всё равно позаниматься</button>`
    : `<button class="btn primary big" data-act="startSession">${allDone ? "Открыть занятие ещё раз" : done.length ? "Продолжить занятие" : "Начать занятие"}</button>`;
  return `
  <h1 class="hand">${cap(WEEKDAYS[wd])}, ${humanDate(t)}</h1>
  <p class="sub">${allDone ? "Занятие проведено." : `Занятие на ${totalMinutes()} минуты.`} Неделя ${programWeek()} программы.</p>
  ${weekStrip()}${checkOffer() ? checkCallout() : ""}
  ${dayStreak() > 1 ? `<p class="streak">${dayStreak()} ${plural(dayStreak(), "день", "дня", "дней")} подряд</p>` : ""}
  <ol class="plan">
    ${blocksFor(type).map((b, i) => {
      const ok = done.includes(b.id);
      return `<li class="${ok ? "done" : ""}"><span class="mark" aria-hidden="true">${ok ? CHECK : i + 1}</span><span class="t">${b.title}</span><span class="min">${b.minutes} мин</span></li>`;
    }).join("")}
  </ol>
  ${cta}${nextHintsHTML()}${backupCallout(t)}
  ${wd === 6 && !weekRowDone ? `<div class="callout"><p>Суббота — день замера: чтение на новом тексте, Шульте 3×3, ряды, ступень.</p><button class="btn primary" data-act="go" data-to="weekly">Сделать замер недели</button></div>` : ""}
  <section class="status">
    <h2 class="hand">Лестница по числу</h2>
    ${staircase(S.ladderStep)}
    <p>Ступень ${step.n}: ${step.name.toLowerCase()}. ${streak ? `Легко подряд: ${streak} из 3.` : "Работаем здесь."}</p>
    <h2 class="hand">Сейчас в работе</h2>
    <p>Ряды: прямой ${S.span.fwd}, обратный ${S.span.bwd}. Шульте ${S.schulteSize}×${S.schulteSize}${lastS ? `, последний раз ${lastS.sec} с` : ""}. ${S.probes.length > 1 ? `Проверка звуков ${humanDate(S.probe.d)}: ${S.probe.errors} из 9 с ошибкой.` : S.probe ? `Первая проверка звуков: ${S.probe.errors} из 9 с ошибкой.` : "Первая проверка звуков ещё впереди."}${probeDue() ? " Пора повторной проверки звуков." : ""}</p>
  </section>
  ${stageLine()}
  <button class="btn big" data-act="go" data-to="trainers">Тренажёры</button>
  <nav class="tools" aria-label="Разделы">
    <button class="btn" data-act="go" data-to="weekly">Замер недели</button>
    <button class="btn" data-act="go" data-to="progress">Прогресс</button>
    <button class="btn" data-act="go" data-to="notes">Для специалиста</button>
    <button class="btn" data-act="go" data-to="settings">Настройки</button>
  </nav>
  <details class="more rules" id="d-rules"><summary>Правила программы</summary><ol>${PROGRAM.rules.map(r => `<li>${r}</li>`).join("")}</ol></details>`;
}

/* ---------- Прогресс ---------- */
/* Строка недели текстом; номер недели — по календарю от начала программы, а не по порядку строк */
function rowText(w) {
  const p = [];
  if (w.wpm != null) p.push(`чтение ${w.wpm} сл/мин${w.wcpm != null ? ` (верно ${w.wcpm} сл/мин${w.acc != null ? `, точность ${w.acc}%` : ""})` : ""}`);
  if (w.schulte != null) p.push(`Шульте 3×3 ${w.schulte} с`);
  if (w.schulteCur != null) p.push(`Шульте ${w.schulteCurSize}×${w.schulteCurSize} ${w.schulteCur} с`);
  if (w.fwd != null) p.push(`прямой ряд ${w.fwd}`);
  if (w.bwd != null) p.push(`обратный ряд ${w.bwd}`);
  if (w.step != null) p.push(`ступень числа ${w.step}`);
  return `Неделя ${programWeek(w.d)} (${humanDate(w.d)}): ${p.join(", ")}.`;
}

/* Строка «Старт» — стартовый замер Мирона из программы (PROGRAM.startRow). Только у данных без поля plan —
   это Мирон и старые копии; новая семья (plan есть — по ступеням или по программе) своего старта не видит */
const startRows = () => S.plan ? [] : [{ label: "Старт", ...PROGRAM.startRow }];

function chartFor(key, title, opts = {}) {
  const pts = [...startRows().map(r => ({ label: r.label, v: r[key] })), ...S.weekly.map(w => ({ label: `${programWeek(w.d)}`, v: w[key] }))].filter(p => p.v != null);
  if (pts.length < 2) return "";
  const W = 600, H = 190, L = 34, R = 12, T = 26, B = 30;
  const max = Math.max(...pts.map(p => p.v), opts.goal || 0) * 1.2;
  const y = v => H - B - (v / max) * (H - T - B);
  const bw = Math.min(54, (W - L - R) / pts.length - 10);
  const x = i => L + (i + .5) * ((W - L - R) / pts.length) - bw / 2;
  const best = opts.invert ? Math.min(...pts.map(p => p.v)) : Math.max(...pts.map(p => p.v));
  const bars = pts.map((p, i) => {
    const cls = p.v === best ? "bar good" : i === pts.length - 1 ? "bar now" : "bar";
    return `<rect class="${cls}" x="${x(i).toFixed(1)}" y="${y(p.v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - B - y(p.v)).toFixed(1)}" rx="3"/>
      <text class="v" x="${(x(i) + bw / 2).toFixed(1)}" y="${(y(p.v) - 7).toFixed(1)}" text-anchor="middle">${p.v}</text>
      <text x="${(x(i) + bw / 2).toFixed(1)}" y="${H - 10}" text-anchor="middle">${p.label}</text>`;
  }).join("");
  const goal = opts.goal ? `<line class="goal" x1="${L}" y1="${y(opts.goal).toFixed(1)}" x2="${W - R}" y2="${y(opts.goal).toFixed(1)}"/>
    <text class="g" x="${W - R}" y="${(y(opts.goal) - 6).toFixed(1)}" text-anchor="end">${opts.goal} — тексты длиннее</text>` : "";
  return `<h3>${title}</h3><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">
    <line x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}" stroke="#CBD5E6"/>${goal}${bars}</svg>`;
}

/* По ступеням: где ребёнок сейчас — те же названия ступеней, что на главной */
function stagesNow() {
  const part = line => { const st = stageOf(line); return st ? stageLabel(st) : "ступень не выбрана"; };
  return `<p>Сейчас: чтение — ${part("read")}, счёт — ${part("count")}. Как растут ступени — видно по тренажёрам: в итоге каждого круга «В прошлый раз».</p>`;
}

function progressView() {
  const keys = ["wpm", "schulte", "fwd", "bwd", "step"];
  const better = { wpm: (a, b) => a > b, schulte: (a, b) => a < b, fwd: (a, b) => a > b, bwd: (a, b) => a > b, step: (a, b) => a > b };
  const has = v => v !== null && v !== undefined && !Number.isNaN(v);
  const rows = [...startRows(), ...S.weekly.map(w => ({ label: `Нед. ${programWeek(w.d)}`, sub: humanDate(w.d), ...w }))];
  const body = rows.map((r, i) => {
    const prev = rows[i - 1];
    return `<tr><td>${r.label}${r.sub ? `<small>${r.sub}</small>` : ""}</td>${keys.map(k => {
      // под основным числом — подробности: у чтения правильные слова и точность, у Шульте — свой размер
      let sub = "";
      if (k === "wpm" && has(r.wcpm)) sub = `<small>верно ${r.wcpm}${has(r.acc) ? ` · ${r.acc}%` : ""}</small>`;
      if (k === "schulte" && has(r.schulteCur)) sub = `<small>${r.schulteCurSize}×${r.schulteCurSize}: ${r.schulteCur} с</small>`;
      if (!has(r[k])) return `<td>—${sub}</td>`;
      const up = prev && has(prev[k]) && better[k](r[k], prev[k]);
      return `<td class="${up ? "up" : ""}">${r[k]}${sub}</td>`;
    }).join("")}</tr>`;
  }).join("");
  const full = S.sessions.filter(s => s.done.length >= 4).length;
  const goal = readLevel() === 1 ? 35 : 50;          // линия на графике — порог следующего уровня текстов
  return `
  ${topbar("Раз в неделю")}
  <h1 class="hand">Прогресс</h1>
  <p class="sub">Зелёным — всё, что лучше прошлой недели.</p>${isStagesPlan() ? stagesNow() : ""}
  ${rows.length ? `<div class="table-wrap"><table class="progress">
    <thead><tr><th>Неделя</th><th>Чтение, слов в мин</th><th>Шульте 3×3, с</th><th>Прямой ряд</th><th>Обратный ряд</th><th>Ступень числа</th></tr></thead>
    <tbody>${body}</tbody>
  </table></div>` : ""}
  ${chartFor("wpm", "Чтение, слов в минуту", { goal })}
  ${chartFor("schulte", `Шульте 3×3, секунды`, { invert: true })}
  <p>Занятий проведено полностью: ${full}, подряд: ${dayStreak()}.</p>
  ${S.weekly.length ? `<button class="btn" data-act="copyLast">Скопировать последнюю строку</button>`
    : `<p class="hint">Первая строка появится после замера недели.</p><button class="btn" data-act="go" data-to="weekly">Сделать замер недели</button>`}
  ${ui.copyBox ? `<textarea class="copybox" readonly rows="3">${esc(ui.copyBox)}</textarea>` : ""}`;
}

/* ---------- Для специалиста ---------- */
function currentLevels() {
  const read = stageOf("read"), count = stageOf("count");
  // занятие по ступеням — ступени чтения и счёта; программа — лестница по числу и ряды, как было
  const p = isStagesPlan()
    ? [`чтение — ${read ? stageLabel(read) : "ступень не выбрана"}`, `счёт — ${count ? stageLabel(count) : "ступень не выбрана"}`, `Шульте ${S.schulteSize}×${S.schulteSize}`]
    : [`лестница по числу: ступень ${S.ladderStep}`, `ряды: прямой ${S.span.fwd}, обратный ${S.span.bwd}`, `Шульте ${S.schulteSize}×${S.schulteSize}`];
  const last = [...S.weekly].reverse().find(w => w.wpm != null);
  if (last) p.push(`чтение ${last.wpm} сл/мин (${humanDate(last.d)})`);
  p.push(S.probes.length ? `проверки звуков: ${probeHistory()}` : "проверки звуков ещё не было");
  p.push(`Муха: уровень ${S.flyLevel} из ${PROGRAM.flyLevels.length}`);
  const st = stumbleTop(10);
  if (st.length) p.push(`слова с запинками за 3 недели: ${st.map(x => `${x.w}${x.n > 1 ? ` (${x.n})` : ""}`).join(", ")}`);
  return cap(p.join("; ")) + ".";
}

function noteGroups() {
  const g = {};
  for (const n of S.notes) (g[n.what] = g[n.what] || []).push(n.d);
  return Object.entries(g);
}

function specialistText() {
  const lines = [`${S.childName || "Ребёнок"}: домашняя программа с ${humanDate(S.startDate)}.`, currentLevels()];
  const g = noteGroups();
  if (g.length) { lines.push("Отметки:"); for (const [what, ds] of g) lines.push(`— ${what} (${ds.map(humanDate).join(", ")})`); }
  if (S.weekly.length) { lines.push("Замеры:"); S.weekly.forEach(w => lines.push(rowText(w))); }
  return lines.join("\n");
}

function notesView() {
  const g = noteGroups();
  return `
  ${topbar("Покажи на консультации")}
  <h1 class="hand">Для специалиста</h1>
  <p class="sub">Сводка для логопеда, учителя или врача: где ребёнок сейчас и что не пошло — с датами. Нужна консультация — нажми «Скопировать всё» внизу и отправь.</p>
  <section class="part"><h2 class="hand">Сейчас</h2><p>${esc(currentLevels())}</p></section>
  <section class="part"><h2 class="hand">Отметки</h2>
    ${g.length ? `<ul class="notes">${g.map(([what, ds]) => `<li><strong>${esc(what)}</strong><br><span class="hint">${ds.map(humanDate).join(", ")}</span></li>`).join("")}</ul>`
      : `<p class="hint">Пока пусто. Кнопка «Не пошло» под любым упражнением добавляет сюда отметку с датой.</p>`}
    <label class="field"><span>Своя заметка</span><textarea id="ownNote" rows="3" placeholder="Например: на диагоналях глаза теряют ручку"></textarea></label>
    <button class="btn" data-act="addOwnNote">Добавить заметку</button>
  </section>
  <button class="btn primary big" data-act="copyNotes">Скопировать всё для отправки</button>
  ${ui.copyBox ? `<textarea class="copybox" readonly rows="8">${esc(ui.copyBox)}</textarea>` : ""}`;
}

/* Пятиминутка «Память и внимание»: ряды цифр, диктант, муха голосом, «повтори наоборот» */

function memoryBlock() {
  const g = PROGRAM.memory.games, byId = id => g.find(x => x.id === id);
  const rotating = ["dict", "fly", "corr", "rev", "ban"].map(byId);
  const pick = [byId("span"), rotating[sessionIndex() % rotating.length]];   // ряды всегда + одна игра по кругу
  return `<section class="part">
    <h2 class="hand">Две игры на сегодня</h2>
    ${pick.map(memoryGame).join("")}
    <details class="more" id="d-mem"><summary>Другие игры</summary>${g.filter(x => !pick.includes(x)).map(memoryGame).join("")}</details>
  </section>`;
}

/* Цифровые ряды отдельно — для «Звуков и рядов» */
const spanGame = () => memoryGame(PROGRAM.memory.games.find(x => x.id === "span"));

function memoryGame(g) {
  let extra = "";
  if (g.id === "dict") {
    const figs = ui.dictFig ? [ui.dictFig] : g.figures;
    extra = figs.map((f, i) => `<h4>${f.name}</h4><p>${f.say}</p>${figureSVG(f.moves, i)}`).join("")
      + `<div class="tool-row"><button class="btn small" data-act="dictNew">Новая фигура</button>${ui.dictFig ? `<button class="btn small" data-act="dictBack">Флажок и лесенка</button>` : ""}</div>`;
  }
  if (g.id === "fly") extra = muhaTool();
  if (g.id === "span") extra = spanTool();
  if (g.id === "corr") extra = `<p><strong>${programWeek() >= 2 ? "Со второй недели: «а» вычёркивай, «о» обводи." : "Первая неделя: вычёркивай букву «а»."}</strong></p>${miniBtn("mini-corr", 180, "Таймер на 3 минуты")}`;
  if (g.id === "rev") extra = revTool();
  return exItem(g, extra);
}

function muhaTool() {
  const streak = muhaStreak();
  return `<div class="tool-row">
      <button class="btn" data-act="openFly">Играть на экране</button>
      <span class="hint">Команд: <b>${S.muhaLen}</b></span>
      <button class="btn small" data-act="muhaLen" data-d="-1" aria-label="Меньше команд">−</button>
      <button class="btn small" data-act="muhaLen" data-d="1" aria-label="Больше команд">+</button>
    </div>
    <p class="hint">Верно подряд: ${streak} из 3.${streak >= 3 ? " Пора добавить команду." : ""}</p>
    <details class="more" id="d-fly"><summary>Читать команды голосом</summary>
      <div class="tool-row"><button class="btn small" data-act="muhaNew">Новая муха</button></div>
      ${ui.muha ? `<p class="say">${ui.muha.moves.join(", ")}… хлоп!</p>
        <button class="btn small" data-act="muhaShow">${ui.muha.shown ? "Спрятать ответ" : "Где муха?"}</button>
        ${ui.muha.shown ? mini3(ui.muha.end) : ""}` : ""}
    </details>`;
}

function spanTool() {
  const t = todayISO();
  return ["fwd", "bwd"].map(dir => {
    const len = S.span[dir], seq = ui.spanSeq[dir];
    const mark = S.spanLog.find(x => x.d === t && x.dir === dir);
    const streak = spanStreak(dir);
    return `<div class="span-box">
      <h4>${dir === "fwd" ? "Прямой ряд" : "Обратный ряд"}: ${len} ${plural(len, "цифра", "цифры", "цифр")}</h4>
      ${seq ? `<p class="digits">${seq.join(" ")}</p>` : ""}
      ${seq && dir === "bwd" ? `<p class="answer">Он говорит: ${[...seq].reverse().join(" ")}</p>` : ""}
      <div class="tool-row">
        <button class="btn small" data-act="spanNew" data-dir="${dir}">Новый ряд</button>
        <button class="btn small ${mark && mark.ok ? "on" : ""}" data-act="spanMark" data-dir="${dir}" data-ok="1">Сегодня без ошибок</button>
        <button class="btn small ${mark && !mark.ok ? "picked" : ""}" data-act="spanMark" data-dir="${dir}" data-ok="0">Были ошибки</button>
      </div>
      <p class="hint">Без ошибок подряд: ${streak} из 3.</p>
      ${streak >= 3 && len < 9 ? `<button class="btn primary small" data-act="spanUp" data-dir="${dir}">Добавить цифру: будет ${len + 1}</button>` : ""}
      <div class="tool-row">
        <span class="hint">Цифр в ряду: <b>${len}</b></span>
        <button class="btn small" data-act="spanLen" data-dir="${dir}" data-d="-1" aria-label="Меньше цифр">−</button>
        <button class="btn small" data-act="spanLen" data-dir="${dir}" data-d="1" aria-label="Больше цифр">+</button>
      </div>
    </div>`;
  }).join("");
}

function revTool() {
  return `<div class="tool-row"><button class="btn small" data-act="revNew" data-n="2">Два слова</button><button class="btn small" data-act="revNew" data-n="3">Три слова</button></div>
  ${ui.rev ? `<p class="say">${ui.rev.join(" — ")}</p><p class="answer">Он говорит: ${[...ui.rev].reverse().join(" — ")}</p>` : ""}`;
}

/* Пятиминутка «Звуки»: первая проверка звуков, игры со звуками, анаграммы.
   minutes — когда звуки только часть блока («Звуки и ряды»): заголовок со временем и свой таймер */

/* Какие игры сегодня. Обычно пары по кругу; в последней проверке ошибки на «убери звук» —
   «Убери звук» каждый день, а вторая игра — из остальных по кругу */
function todayGames() {
  const games = PROGRAM.phonemes.games, pairs = [[0, 1], [2, 3], [4, 5]];
  if (outFocus()) {
    const out = games.find(g => g.id === "out"), rest = games.filter(g => g !== out);
    return [out, rest[sessionIndex() % rest.length]];
  }
  const [a, b] = pairs[sessionIndex() % 3];
  return [games[a], games[b]];
}

function phonemesBlock(minutes = 0) {
  const games = PROGRAM.phonemes.games, focus = !!S.probe && outFocus();
  const pick = S.probe ? todayGames() : [games[[0, 2, 4][sessionIndex() % 3]]];   // в день зонда — одна игра
  const head = (S.probe ? probeHead() : probeSection()) + paperSection();
  return `${head}
  <section class="part">
    <h2 class="hand">${S.probe ? "Две игры на сегодня" : "И одна игра"}${minutes ? `, ${minutes} ${plural(minutes, "минута", "минуты", "минут")}` : ""}</h2>${focus ? `
    <p class="hint">В последней проверке звуков ошибки на «убери звук» — эта игра теперь в каждом занятии, пока следующая проверка не пройдёт без них.</p>` : ""}${minutes ? `
    <div class="tool-row">${miniBtn("mini-ph", minutes * 60, `Таймер на ${minutes} ${plural(minutes, "минуту", "минуты", "минут")}`)}</div>` : ""}
    ${pick.map(phonemeGame).join("")}
    <details class="more" id="d-ph"><summary>Все игры со звуками</summary>${games.filter(g => !pick.includes(g)).map(phonemeGame).join("")}</details>
  </section>`;
}

/* Проверки уже были: итог, а через probeEvery дней — кнопка повторной проверки с новым набором */
function probeHead() {
  const done = S.probes.length > 1 ? `Проверки звуков: ${probeHistory()}.` : `Первая проверка звуков ${humanDate(S.probe.d)}: ${S.probe.errors} из 9 с ошибкой.`;
  const next = nextProbeSet();
  let more;
  if (ui.probeOpen && next) more = probeSection();
  else if (probeDue()) more = `<div class="callout"><p>Прошло ${PROGRAM.phonemes.probeEvery} дней — пора повторной проверки звуков: набор ${next.set}, слова новые.</p>
    <button class="btn primary" data-act="probeOpen">Повторная проверка звуков</button></div>`;
  else if (next) more = `<p class="hint">Повторная проверка звуков — с ${humanDate(probeDueFrom())}, набор ${next.set}.</p>`;
  else more = `<p class="hint">Все пять наборов проверки звуков пройдены. Если звуки ещё путаются, покажи сводку «Для специалиста» логопеду — он подберёт новые слова.</p>`;
  return `<p class="hint">${done} ${S.phonemeDaily ? "Звуки теперь каждый день." : "Звуки — по понедельникам, средам и пятницам."}</p>
  ${more}`;
}

/* Проверка прошла на бумаге — внести её в ту же историю: набор, дата, номера вопросов с ошибкой */
function paperSection() {
  const left = probeSetsLeft();
  if (!left.length) return "";
  const p = ui.paper || { set: null, d: todayISO(), wrong: [] };
  const items = p.set ? probeSets().find(x => x.set === p.set).items : [];
  return `
  <details class="more" id="d-paper"${ui.paper ? " open" : ""}><summary>Внести проверку с бумаги</summary>
    <p class="hint">Проверка прошла без приложения — внеси её сюда, она встанет в ту же историю.</p>
    <div class="choice"><span class="hint">Набор:</span>${left.map(x => `<button class="btn small ${p.set === x.set ? "picked" : ""}" data-act="paperSet" data-s="${x.set}">${x.set}</button>`).join("")}</div>
    <label class="field"><span>Дата проверки</span><input type="date" id="paperDate" value="${p.d}" max="${todayISO()}"></label>
    ${p.set ? `<p class="hint">Отметь вопросы с ошибкой. Ошибок не было — ничего не отмечай.</p>
    <ol class="probe-list">${items.map((x, i) => `<li><p>${x.q}</p>
      <button class="btn small ${p.wrong.includes(i + 1) ? "picked" : ""}" data-act="paperWrong" data-n="${i + 1}">Ошибка</button></li>`).join("")}</ol>` : ""}
    <button class="btn primary" data-act="paperSave" ${p.set ? "" : "disabled"}>Внести в историю${p.set ? `: набор ${p.set}, ${p.wrong.length} из ${items.length}` : ""}</button>
  </details>`;
}

/* Первый раз — зонд, набор А; потом — повторная проверка следующим набором */
function probeSection() {
  const { set, items: qs } = probeToTake(), first = !S.probes.length;
  const answered = qs.filter((_, i) => ui.probeAns[i] !== undefined).length;
  return `<section class="part">
    <h2 class="hand">${first ? "Сначала — первая проверка звуков: один раз, 2 минуты" : `Повторная проверка звуков, набор ${set}`}</h2>
    <p class="hint">Спрашивай устно, ответ виден только тебе. Две ошибки и больше — звуки ${first ? "станут" : "будут"} ежедневными.</p>
    <ol class="probe-list">
      ${qs.map((x, i) => `<li><p>${x.q}</p><p class="answer">Ответ: ${x.a}</p>
        <div class="choice">
          <button class="btn small ${ui.probeAns[i] === true ? "on" : ""}" data-act="probeMark" data-i="${i}" data-ok="1">Верно</button>
          <button class="btn small ${ui.probeAns[i] === false ? "picked" : ""}" data-act="probeMark" data-i="${i}" data-ok="0">Ошибка</button>
        </div></li>`).join("")}
    </ol>
    <button class="btn primary" data-act="probeSave" ${answered < qs.length ? "disabled" : ""}>Сохранить результат проверки (${answered} из ${qs.length})</button>
  </section>`;
}

function phonemeGame(g) {
  let extra = "";
  if (g.answer) extra += `<p class="answer">${g.answer}</p>`;
  if (g.words) extra += anagramTool(g.words);
  if (g.id === "out") extra += outTool();
  return exItem(g, extra);
}

/* «Убери звук»: ступень, кнопка на экран и какое слово будет следующим (видишь только ты) */
function outTool() {
  const step = S.soundOutStep, next = outNext();
  return `<div class="choice"><span class="hint">Ступень:</span>
      <button class="btn small ${step === 1 ? "picked" : ""}" data-act="outStep" data-n="1">1 — первый звук</button>
      <button class="btn small ${step === 2 ? "picked" : ""}" data-act="outStep" data-n="2">2 — последний звук</button></div>
    <div class="tool-row"><button class="btn" data-act="openSoundOut">Открыть на экране</button></div>
    <p class="hint">${next ? `Следующее слово: ${next.w} → ${next.a}.` : `Все слова этой ступени были за неделю, новые — с ${humanDate(outFreeFrom())}.`} Слова идут по кругу и не повторяются 7 дней.</p>`;
}

function anagramTool(words) {
  const w = words[ui.anagram.i % words.length];
  if (ui.anagram.word !== w || !ui.anagram.order) {
    ui.anagram.word = w;
    let s = shuffle(w.split("")), k = 0;
    while (s.join("") === w && k++ < 10) s = shuffle(w.split(""));
    ui.anagram.order = s;
  }
  return `<div class="tiles" role="img" aria-label="Буквы вразброс">${ui.anagram.order.map(ch => `<span>${ch}</span>`).join("")}</div>
  <div class="tool-row"><button class="btn small" data-act="anaShow">${ui.anagram.shown ? `Слово: ${w}` : "Показать слово"}</button><button class="btn small" data-act="anaNext">Другое слово</button></div>`;
}

/* Блок 4 занятия: пятиминутка — звуки или память, по дню недели или на выбор.
   Звуки каждый день — «Звуки и ряды»: сначала звуки, потом цифровые ряды. */

const minutes = n => `${n} ${plural(n, "минута", "минуты", "минут")}`;

function dailyBlock() {
  const d = PROGRAM.phonemes.daily;
  return `<p class="hint">${d.text}</p>
  ${phonemesBlock(d.phonemes)}
  <section class="part">
    <h2 class="hand">Цифровые ряды, ${minutes(d.span)}</h2>
    <div class="tool-row">${miniBtn("mini-span", d.span * 60, `Таймер на ${d.span} ${plural(d.span, "минуту", "минуты", "минут")}`)}</div>
    ${spanGame()}
  </section>`;
}

function fiveBlock() {
  if (!ui.session.fiveType) return `<section class="part"><h2 class="hand">Выбери пятиминутку</h2>
    <div class="tool-row"><button class="btn" data-act="pickFive" data-t="phonemes">Звуки</button><button class="btn" data-act="pickFive" data-t="memory">Память и внимание</button></div></section>`;
  if (ui.session.fiveType === "daily") return dailyBlock();
  return ui.session.fiveType === "phonemes" ? phonemesBlock() : memoryBlock();
}

/* Блок 3 занятия: число — лестница по ступеням */

function numberBlock() {
  const st = PROGRAM.ladder.steps[S.ladderStep], t = todayISO();
  const mark = S.ladderLog.find(x => x.d === t && x.step === S.ladderStep);
  const streak = ladderStreak(), isLast = S.ladderStep === PROGRAM.ladder.steps.length - 1;
  const choice = (m, label, cls) => {
    const sel = !!(mark && mark.mark === m);
    return `<button class="btn ${sel ? cls : ""}" data-act="ladderMark" data-m="${m}" aria-pressed="${sel}">${label}</button>`;
  };
  return `
  <section class="part">
    ${staircase(S.ladderStep)}
    <h2 class="hand">Ступень ${st.n}. ${st.name}</h2>
    <p>${st.text}</p>
    <div class="tool-row"><button class="btn small" data-act="openDots">Сколько точек?</button><button class="btn small" data-act="openHidden">Сколько в кулаке?</button></div>
    <p class="hint">Игры ступени 1 на экране: домино мелькает на полторы секунды — число видно сразу, без пересчёта; камешки прячутся в кулак — так перебирается состав числа до 10. Главное — предметы на столе, экран в помощь.</p>
    <p class="hint">${PROGRAM.ladder.rules}</p>
    <p class="hint">${PROGRAM.ladder.games}</p>
    <div class="callout"><p>${PROGRAM.ladder.watch}</p>
      <div class="tool-row"><button class="btn small" data-act="openPairs">Пары: чёт и нечёт</button><button class="btn small" data-act="openChain">Цепочка по два</button></div>
    </div>
  </section>
  <section class="part">
    <h2 class="hand">Как пошло сегодня</h2>
    <div class="choice">${choice("easy", "Легко", "on")}${choice("hard", "С трудом", "picked")}${choice("no", "Не пошло", "picked")}</div>
    <p class="hint">Легко подряд: ${streak} из 3.</p>
    ${streak >= 3 && !isLast ? `<button class="btn primary" data-act="ladderUp">Переходим на ступень ${S.ladderStep + 1}</button>` : ""}
    ${streak >= 3 && isLast ? `<p class="green">Лестница пройдена целиком.</p>` : ""}
    <details class="more" id="d-ladder"><summary>Поставить ступень вручную</summary>
      <div class="choice">${PROGRAM.ladder.steps.map(s => `<button class="btn small ${s.n === S.ladderStep ? "picked" : ""}" data-act="ladderSet" data-n="${s.n}">${s.n}</button>`).join("")}</div>
    </details>
  </section>`;
}

/* Блок 2 занятия: чтение — свои слова, слоговая таблица, текст */

/* Список текстов на выбор; level — атрибут уровня для кнопки («» или data-l="2») */
function libList(list, used, level) {
  const pt = S.practiceText;
  return `<ul class="lib">${list.map((x, i) => {
        const u = used.includes(i), cur = pt && pt.text === x;
        return `<li><p class="${u ? "used" : ""}">${esc(x.slice(0, 58))}…</p>
          <button class="btn small ${cur ? "picked" : ""}" data-act="libPick" data-i="${i}"${level}>${cur ? "Сейчас" : u ? "Ещё раз" : "Взять"}</button></li>`;
      }).join("")}</ul>`;
}

/* После чтения: три вопроса к тексту, на третий день — пересказ. Ответы видишь только ты */
function talkPart(pt, day) {
  const qs = talkFor(pt.text);
  return `<h3>После чтения</h3>
    <p class="hint">${PROGRAM.reading.talk}</p>
    ${day >= 3 ? `<p class="hint green">Сегодня ${day > 3 ? "текст уже знакомый" : "третий день"} — пусть перескажет своими словами.</p>` : ""}
    <ol class="probe-list">${qs.map(x => `<li><p>${esc(x.q)}</p><p class="answer">${esc(x.a)}</p></li>`).join("")}</ol>`;
}

function readingBlock() {
  const pt = S.practiceText, t = todayISO();
  let dayInfo = "", day = 0;
  if (pt) {
    day = pt.dates.includes(t) ? pt.dates.length : pt.dates.length + 1;
    dayInfo = day > 3 ? `<p class="hint green">Этот текст отработан 3 дня — пора новый.</p>` : `<p class="hint">Текст: день ${day} из 3.</p>`;
  }
  const top = stumbleTop(8);
  return `
  ${top.length ? `<section class="part">
    <h2 class="hand">Разминка: твои слова</h2>
    <p>Слова, где он запинался на прошлых занятиях: цифра — на скольких занятиях. Прочитать два раза, по слогам и целиком, до основного текста. Крестик убирает слово; если запнётся снова, оно вернётся само.</p>
    <div class="chips">${top.map(x => `<span class="chip"><b>${esc(x.w)}</b>${x.n > 1 ? `<small>×${x.n}</small>` : ""}<button data-act="dropWord" data-w="${esc(x.w)}" aria-label="Убрать слово ${esc(x.w)}">×</button></span>`).join("")}</div>
    <div class="tool-row"><button class="btn" data-act="openWords">Открыть на весь экран</button></div>
  </section>` : ""}
  <section class="part">
    <h2 class="hand">Шаг 1. Слоговая таблица, 2 минуты</h2>
    <p>${PROGRAM.reading.step1}</p>
    <div class="tool-row">
      ${Object.entries(PROGRAM.syllables).map(([key, T]) => `<button class="btn" data-act="openSyl" data-t="${key}">${T.name}</button>`).join("\n      ")}
    </div>
    <p class="hint">${programWeek() <= 2 ? "Первые 2 недели — таблица 1." : "Следующая таблица — когда предыдущая идёт легко: 2 — стечения согласных, 3 — шипящие и ц, 4 — шипящие в сочетаниях, 5 — й, ь, ъ и три согласных подряд."}</p>
  </section>
  <section class="part">
    <h2 class="hand">Шаг 2. Текст, 10 минут</h2>
    <p>${PROGRAM.reading.step2}</p>
    ${readLevel() > 1 ? `<p class="hint green">${cap(level2Why(lastReadRow()))} — можно брать тексты подлиннее: следующий текст — из ${readLevel() === 3 ? "третьего уровня, 70–90 слов" : "второго уровня, 50–70 слов"}.</p>` : ""}
    ${pt ? `${dayInfo}<div class="tool-row"><button class="btn" data-act="openText" data-mode="read">Открыть текст</button></div>
    ${talkPart(pt, day)}` : ""}
    <div class="tool-row"><button class="btn ${pt ? "small" : "primary"}" data-act="libNext">Взять следующий текст из списка</button></div>
    <details class="more" id="d-text">
      <summary>Выбрать текст самому</summary>
      ${libList(PROGRAM.practiceTexts, S.practiceUsed, "")}
      <h4>Второй уровень: 50–70 слов, когда читает 35+ слов в минуту</h4>
      ${libList(PROGRAM.practiceTexts2, S.practiceUsed2, ' data-l="2"')}
      <h4>Третий уровень: 70–90 слов, когда читает 50+ слов в минуту</h4>
      ${libList(PROGRAM.practiceTexts3, S.practiceUsed3, ' data-l="3"')}
      <h4>Или свой текст</h4>
      <textarea id="practiceInput" rows="4" placeholder="Вставь или набери текст на 30–40 слов"></textarea>
      <div class="tool-row"><button class="btn" data-act="savePracticeText">Сохранить свой текст</button></div>
    </details>
    <p class="hint">Пока он читает, отмечай запинки нажатием на слово. Слова из одной-двух букв не отмечаются. Из этих слов соберётся завтрашняя разминка.</p>
    <h3>Буксир</h3><p>${PROGRAM.reading.tug}</p>
  </section>`;
}

/* Блок 1 занятия: разминка — тело и глаза */

function warmupBlock() {
  const pairs = [[0, 1], [2, 3], [4, 5]];
  const [a, b] = pairs[sessionIndex() % 3];            // каждый день новая пара упражнений
  const others = PROGRAM.body.filter((_, i) => i !== a && i !== b);
  return `
  <section class="part">
    <h2 class="hand">Тело: два упражнения на сегодня</h2>
    ${exItem(PROGRAM.body[a])}${exItem(PROGRAM.body[b])}
    <details class="more" id="d-body"><summary>Заменить на другое</summary>${others.map(ex => exItem(ex)).join("")}</details>
  </section>
  <section class="part">
    <h2 class="hand">Глаза: оба, каждый день</h2>
    ${exItem(PROGRAM.eyes.pen, miniBtn("mini-pen", 60, "Таймер на 1 минуту"))}
    ${exItem(PROGRAM.eyes.schulte, schulteTools())}
  </section>`;
}

function schulteTools() {
  const size = S.schulteSize, last = lastSchulte(size), best = bestSchulte(size), runs = schulteRuns(size).length;
  return `<div class="tool-row">
      <button class="btn" data-act="openSchulte" data-size="${size}">Открыть таблицу ${size}×${size}</button>
      ${size > 3 ? `<button class="btn small" data-act="openSchulte" data-size="3">3×3</button>` : ""}
    </div>
    <p class="hint">${last ? `Последний раз: ${last.sec} с, ${humanDate(last.d)}.` : "Каждый раз новая раскладка — расположение не выучить."}
      ${runs > 1 ? ` Рекорд ${size}×${size}: <span class="record">${best} с</span>.` : ""}</p>
    ${schulteReady4() ? `<p class="hint green">Три последних раза быстрее 20 секунд — пора на 4×4.</p><button class="btn small" data-act="setSchulteSize" data-size="4">Перейти на 4×4</button>` : ""}${schulteReady5() ? `<p class="hint green">Три последних раза 4×4 быстрее 20 секунд — пора на 5×5.</p><button class="btn small" data-act="setSchulteSize" data-size="5">Перейти на 5×5</button>` : ""}`;
}

/* Экран занятия: верхняя строка с таймером, текущий блок, «Назад» и «Дальше» */

function sessionView() {
  if (!ui.session) return home();
  if (ui.session.plan === "stages") return stagesSessionView();          // занятие по ступеням (src/plan.js)
  const b = blocksFor(ui.session.fiveType || "rest")[ui.session.idx];
  const body = { warmup: warmupBlock, reading: readingBlock, number: numberBlock, five: fiveBlock }[b.id]();
  return `
  <div class="topbar">
    <button class="btn ghost" data-act="go" data-to="home">Главная</button>
    <span class="of">Блок ${ui.session.idx + 1} из 4</span>
    <button id="timer" class="timer" data-act="timerToggle"></button>
  </div>
  <h1 class="hand">${b.title}</h1>
  <p class="sub">${b.minutes} минут по таймеру. Запусти его, когда начнёте.</p>
  ${body}
  <div class="block-nav">
    ${ui.session.idx > 0 ? `<button class="btn" data-act="prevBlock">Назад</button>` : `<button class="btn" data-act="go" data-to="trainers">Тренажёры</button>`}
    <button class="btn primary grow" data-act="blockDone">${ui.session.idx < 3 ? "Блок готов, дальше" : "Закончить занятие"}</button>
  </div>`;
}

function stagePart(line) {
  const st = stageOf(line), auto = stageAuto(line), manual = stageManual(line);
  const status = manual ? `<b>${stageLabel(st)}</b> — ${S.check && S.check[line] === st.n ? `по входной проверке ${humanDate(S.check.d)}` : "выбрано вручную"}${auto.n !== null && auto.n !== st.n ? ` (по занятиям — ${stageLabel(STAGES[line][auto.n])})` : ""}.` : st ? `<b>${stageLabel(st)}</b> — определено по занятиям: ${auto.why}.` : `Пока не определена — ${auto.why}.`;
  return `
    <h3>${line === "read" ? "Ступень чтения" : "Ступень счёта"}</h3>
    <p class="stage-status" data-line="${line}">${status}</p>
    <p class="hint">${st ? `Осваиваем: ${st.about}. Дальше — когда ${st.next}.` : "Выбери ступень — тогда в «Тренажёрах» сверху будут нужные."}</p>
    ${manual ? `<button class="btn small" data-act="stageAuto" data-line="${line}">Вернуть автоматический выбор</button>` : ""}

/* Генераторы заданий: куда летит муха, какую фигуру диктовать, какой ряд цифр назвать */

/* Ходы мухи для конкретного уровня.
   Возвращает: moves (стрелка + сколько клеток), end (где села) и escaped (улетела за поле). */
const DIR8 = [["вверх", -1, 0], ["вниз", 1, 0], ["влево", 0, -1], ["вправо", 0, 1],
  ["вверх-вправо", -1, 1], ["вниз-вправо", 1, 1], ["вниз-влево", 1, -1], ["вверх-влево", -1, -1]];
function flyGen(lvl) {
  const dirs = lvl.diag ? DIR8 : DIR8.slice(0, 4);
  const start = Math.floor(lvl.size / 2);
  const wantEscape = lvl.esc && Math.random() < 0.4;      // примерно в двух случаях из пяти муха улетает
  for (let attempt = 0; attempt < 30; attempt++) {
    let r = start, c = start, prev = null;
    const moves = [];
    while (moves.length < lvl.len) {
      const opts = shuffle(dirs).filter(d => !(prev && d[1] === -prev[1] && d[2] === -prev[2]));
      let placed = false;
      for (const d of opts) {
        const n = 1 + rnd(lvl.steps);
        const nr = r + d[1] * n, nc = c + d[2] * n;
        const out = nr < 0 || nr >= lvl.size || nc < 0 || nc >= lvl.size;
        if (out) {
          if (!wantEscape || moves.length < 2) continue;   // рано улетать — берём другое направление
          moves.push({ w: d[0], n });
          return { moves, end: null, escaped: true, lastIn: [r, c] };
        }
        r = nr; c = nc; prev = d; moves.push({ w: d[0], n }); placed = true; break;
      }
      if (!placed) break;
    }
    if (moves.length === lvl.len && !wantEscape) return { moves, end: [r, c], escaped: false };
  }
  const lite = { ...lvl, esc: false, diag: false, steps: 1 };
  return lvl.esc || lvl.diag || lvl.steps > 1 ? flyGen(lite) : { moves: [{ w: "вверх", n: 1 }], end: [start - 1, start], escaped: false };
}

function muhaGen(n) {
  const D = [["вверх", -1, 0], ["вниз", 1, 0], ["влево", 0, -1], ["вправо", 0, 1]];
  let r = 1, c = 1, prev = null; const moves = [];
  while (moves.length < n) {
    let opts = D.filter(([, dr, dc]) => r + dr >= 0 && r + dr <= 2 && c + dc >= 0 && c + dc <= 2);
    const onward = opts.filter(([, dr, dc]) => !(prev && dr === -prev[1] && dc === -prev[2]));
    if (onward.length) opts = onward;          // без «туда-обратно» подряд
    const m = opts[rnd(opts.length)];
    r += m[1]; c += m[2]; prev = m; moves.push(m[0]);
  }
  return { moves, end: [r, c], shown: false };
}

/* Случайная фигура для графического диктанта: линия не наступает сама на себя */
function dictGen() {
  const DIRS = [["up", 0, -1], ["down", 0, 1], ["left", -1, 0], ["right", 1, 0]];
  const WORD = { up: "вверх", down: "вниз", left: "влево", right: "вправо" };
  for (let attempt = 0; attempt < 40; attempt++) {
    let x = 0, y = 0, prev = null;
    const used = new Set(), moves = [], want = 5 + rnd(3);
    while (moves.length < want) {
      const opts = shuffle(DIRS).filter(([, dx, dy]) => !prev || (dx !== prev[1] || dy !== prev[2]) && !(dx === -prev[1] && dy === -prev[2]));
      let placed = false;
      for (const dir of opts) {
        const n = 1 + rnd(3);
        let cx = x, cy = y, fits = true; const edges = [];
        for (let i = 0; i < n; i++) {
          const nx = cx + dir[1], ny = cy + dir[2];
          const key = [cx + ":" + cy, nx + ":" + ny].sort().join("|");   // отрезок между двумя точками
          if (used.has(key) || nx < -4 || nx > 4 || ny < -4 || ny > 4) { fits = false; break; }
          edges.push(key); cx = nx; cy = ny;
        }
        if (!fits) continue;
        edges.forEach(k => used.add(k));
        x = cx; y = cy; prev = dir; moves.push([dir[0], n]); placed = true; break;
      }
      if (!placed) break;                                               // зашли в тупик — пробуем заново
    }
    if (moves.length === want) {
      const say = moves.map(([dir, n]) => `${n} ${plural(n, "клетка", "клетки", "клеток")} ${WORD[dir]}`).join(", ");
      return { name: "Своя фигура", say: cap(say) + ".", moves };
    }
  }
  return PROGRAM.memory.games.find(g => g.id === "dict").figures[0];
}

function digitRow(n) { const out = []; while (out.length < n) { const d = 1 + rnd(9); if (d !== out[out.length - 1]) out.push(d); } return out; }

/* Быстрый замер рядов в «Замере недели». Страницу не трогает — только считает.
   Прямой ряд начинается с 4 цифр, обратный — с 3. На каждую длину — два разных ряда.
   Хотя бы один из двух верный — длина взята, дальше +1 (но не длиннее 9).
   Оба неверные:
   — если выше уже была взятая длина — стоп, итог — она;
   — если на стартовой длине оба неверные — спускаемся на одну цифру, там снова два ряда,
     и так вниз, пока не будет хотя бы одного верного, но не ниже 2. Взятая при спуске
     длина — итог, обратно вверх не идём (длину выше он уже не прошёл).
     Не прошёл и 2 — итог не определён (null), поле в замере остаётся пустым.
   Сначала весь прямой ряд, потом весь обратный. */

const START = { fwd: 4, bwd: 3 };
const MIN = 2, MAX = 9;              // как и ручная установка длины (2–9)

/* Новый ряд нужной длины, не такой, как прежний */
function newRow(len, prev) {
  let seq = digitRow(len);
  while (prev && seq.join("") === prev.join("")) seq = digitRow(len);
  return seq;
}

/* Перейти к длине len в направлении dir: снова первый из двух рядов */
function moveTo(run, dir, len) {
  run.dir = dir;
  run.len = len;
  run.attempt = 1;
  run.okHere = false;
  run.seq = newRow(len, null);
  return run;
}

function spanRunStart() {
  return { dir: "fwd", len: START.fwd, attempt: 1, okHere: false, best: { fwd: null, bwd: null }, seq: newRow(START.fwd, null), done: false };
}

/* Отметить ответ на текущий ряд: ok = true — верно, false — нет */
function spanRunMark(run, ok) {
  if (ok) run.okHere = true;
  if (run.attempt === 1) {                        // на этой длине будет ещё один ряд
    run.attempt = 2;
    run.seq = newRow(run.len, run.seq);
    return run;
  }
  // оба ряда показаны
  const dir = run.dir, wentDown = run.len < START[dir];   // ниже стартовой длины бываем только при спуске
  if (run.okHere) {
    run.best[dir] = run.len;                      // хоть один верный — длина взята
    if (!wentDown && run.len < MAX) return moveTo(run, dir, run.len + 1);
  } else if (run.best[dir] === null && run.len > MIN) {
    return moveTo(run, dir, run.len - 1);         // ещё ничего не взято — спускаемся
  }
  if (dir === "fwd") return moveTo(run, "bwd", START.bwd);
  run.done = true;
  run.seq = null;
  return run;
}

/* Итог по направлению: взятая длина или null — не определён */
const spanRunResult = (run, dir) => run.best[dir];

/* ---------- Замер недели (суббота) ---------- */
/* Первое предложение текста — чтобы ты узнал текст, который он уже читал. Ребёнку текст не виден до «Старта» */
const firstSentence = t => (t.match(/^.*?[.!?](?=\s|$)/) || [t])[0];
function newWeeklyDraft() { return { wpm: null, wcpm: null, acc: null, schulte: null, schulteCur: null, schulteCurSize: S.schulteSize > 3 ? S.schulteSize : null, fwd: spanBest("fwd"), bwd: spanBest("bwd"), step: S.ladderStep, textIdx: null, spanRun: null }; }

/* Итог быстрого замера. Не прошёл и 2 цифры — длина не определена, поле пустое */
function spanRunDone(run) {
  const fwd = spanRunResult(run, "fwd"), bwd = spanRunResult(run, "bwd"), say = len => len ?? "не определён";
  const none = fwd === null || bwd === null
    ? `<p class="hint">Не определён — на 2 цифрах оба ряда не вышли. Поле осталось пустым.</p>` : "";
  return `<p class="green">Записано в замер: прямой ряд ${say(fwd)}, обратный ${say(bwd)}.</p>${none}${spanTrainPart(fwd, bwd)}`;
}

/* Связка с тренировкой: длины рядов в занятии — по итогу замера (неопределённую не трогаем) */
function spanTrainPart(fwd, bwd) {
  const dirs = [["fwd", "прямой", fwd], ["bwd", "обратный", bwd]].filter(([, , len]) => len !== null);
  if (!dirs.length) return "";
  const list = dirs.map(([, name, len]) => `${name} ${len}`).join(", "), these = dirs.length > 1 ? "этих длин" : "этой длины";
  if (dirs.every(([dir, , len]) => S.span[dir] === len)) return `<p class="green">Ряды в занятии — с ${these}: ${list}.</p>`;
  return `<div class="tool-row"><button class="btn primary" data-act="spanTrain">Тренировать с ${these}: ${list}</button></div>`;
}

/* Быстрый замер рядов: кнопка, а во время замера — ряд, ответ для обратного и «Верно / Нет» */
function spanRunPart(run) {
  if (!run || run.done) return `${run ? spanRunDone(run) : ""}<button class="btn" data-act="spanMeasure">Замерить ряды</button>`;
  return `<div class="tool-card">
      <h3>${run.dir === "fwd" ? "Прямой ряд" : "Обратный ряд"}: ${run.len} ${plural(run.len, "цифра", "цифры", "цифр")} · ряд ${run.attempt} из 2</h3>
      <p class="digits">${run.seq.join(" ")}</p>
      ${run.dir === "bwd" ? `<p class="answer">Он говорит: ${[...run.seq].reverse().join(" ")}</p>` : ""}
      <div class="tool-row">
        <button class="btn" data-act="spanMeasureMark" data-ok="1">Верно</button>
        <button class="btn" data-act="spanMeasureMark" data-ok="0">Нет</button>
        <button class="btn ghost" data-act="spanMeasureCancel">Прервать</button>
      </div>
    </div>`;
}

/* Шульте на время: на 3×3 — как раньше; тренировка уже на размере больше — на нём и на 3×3, чтобы сравнить со стартом */
function schulteMeasure(d, num) {
  const n = d.schulteCurSize;
  if (!n) return `<section class="part">
    <h2 class="hand">Шульте 3×3 на время</h2>
    <button class="btn" data-act="openSchulte" data-size="3" data-mode="measure">Открыть таблицу</button>
    ${num("schulte", "Секунды")}
  </section>`;
  return `<section class="part">
    <h2 class="hand">Шульте на время</h2>
    <p>Сначала на своём размере, ${n}×${n}, потом 3×3 — чтобы сравнить со стартом.</p>
    <div class="tool-row"><button class="btn" data-act="openSchulte" data-size="${n}" data-mode="measure">Таблица ${n}×${n}</button><button class="btn" data-act="openSchulte" data-size="3" data-mode="measure">Таблица 3×3</button></div>
    <div class="grid3">${num("schulteCur", `${n}×${n}, секунды`)}${num("schulte", "3×3, секунды")}</div>
  </section>`;
}

function weeklyView() {
  const d = ui.weeklyDraft || (ui.weeklyDraft = newWeeklyDraft());
  const ti = nextTextIdx(), same = weekRow();            // одна строка на календарную неделю
  const num = (key, label, hint = "") => `<label class="field"><span>${label}</span><input type="number" inputmode="numeric" min="0" data-bind="${key}" value="${d[key] ?? ""}"${hint ? ` placeholder="${hint}"` : ""}></label>`;
  const reading = d.textIdx !== null

/* Звук «дзынь» на детских экранах. Рисуется прямо в браузере (WebAudio):

let ctx = null;

/* Одна нота колокольчика: тон f в момент t */
function bell(f, t, vol) {
  const g = ctx.createGain();
  g.connect(ctx.destination);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  for (const [mul, k] of [[1, 1], [2.76, 0.22]]) {       // основной тон и «колокольный» обертон
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type = "sine"; o.frequency.value = f * mul; og.gain.value = k;
    o.connect(og); og.connect(g);
    o.start(t); o.stop(t + 1);
  }
}

  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ctx) ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
    const t = ctx.currentTime + 0.02;
    if (kind === "win") [1046.5, 1318.5, 1568].forEach((f, i) => bell(f, t + i * 0.12, 0.07));
    else bell(1318.5, t, 0.08);
  } catch (e) { /* звук не вышел — занятию это не мешает */ }
}

function buildSylOrder() {
  const rows = PROGRAM.syllables[ui.syl.key].rows, o = [];

/* Ширина заглавных букв Stupenki Sans Bold в долях кегля (замерено в браузере).
   Нужна, чтобы таблица с широкими буквами (Ж, Ш, Щ) и слогами из 4 букв влезла
   в узкое окно. Буквы, которой нет в списке, считаем средней шириной */
const LETTER_EM = { А: .725, Б: .691, В: .71, Г: .564, Д: .896, Е: .592, Ё: .592, Ж: 1.111, З: .62, И: .791, Й: .762,
  К: .73, Л: .774, М: .943, Н: .774, О: .733, П: .784, Р: .623, С: .676, Т: .618, У: .591, Ф: .759, Х: .667, Ц: .835,
  Ч: .684, Ш: 1.028, Щ: 1.089, Ъ: .811, Ы: .911, Ь: .671, Э: .657, Ю: 1.04, Я: .715 };
/* Ширина таблицы в кеглях: по каждому столбцу — самая широкая клетка
   (буквы, разрядка .05em после каждой, поля .3em слева и справа — как в .syl td) */
function tableEm(T) {
  const cell = s => [...s].reduce((w, ch) => w + (LETTER_EM[ch] || .8) + .05, 0) + .6;
  let em = 0;
  for (let c = 0; c < T.rows[0].length; c++) em += Math.max(...T.rows.map(row => cell(row[c])));
  return em;
}

function renderSyl() {
  const T = PROGRAM.syllables[ui.syl.key];
  const cur = ui.syl.mode === "free" ? null : ui.syl.order[ui.syl.pos];
  const long = T.rows.some(r => r.some(s => s.length > 2));
  // Влезает ли таблица в 96% ширины окна при обычном кегле (8vw, у длинных слогов 6vw)?
  // Если нет — кегль поменьше, ровно чтобы влезла. Таблицам 1 и 2 хватает обычного
  const fitVw = Math.floor(960 / tableEm(T)) / 10;
  const fit = fitVw < (long ? 6 : 8);
  const cls = `syl ${long ? "long" : ""}${fit ? `${long ? " " : ""}fit` : ""}`;   // у таблиц 1 и 2 — как раньше: «syl », «syl long»
  const style = fit ? ` style="--fit:${fitVw}vw"` : "";
  const modes = [["rows", "По строкам"], ["cols", "По столбцам"], ["random", "Вразбивку"], ["free", "Без подсветки"]];
  ov().innerHTML = `${kidTop(ui.syl.yay || "Читаем по слогам", ui.syl.yay ? "yay" : "", true)}
    <div class="ov-body" ${ui.syl.mode === "free" ? "" : 'data-act="sylNext"'}>
      <table class="${cls}"${style}><tbody>${T.rows.map((row, r) => `<tr>${row.map((s, c) => `<td class="${cur && cur[0] === r && cur[1] === c ? "cur" : ""}">${s}</td>`).join("")}</tr>`).join("")}</tbody></table>
    </div>
    ${parentZone(`<p class="ov-tip"><span class="ov-find">${T.name}, <span id="ov-clock">${ovClock.left === 0 ? "2 минуты прошли" : fmt(ovClock.left)}</span></span>. ${ui.syl.mode === "free" ? "Показывай слоги пальцем." : "Нажимай на таблицу — подсветка идёт дальше."}</p>`,
      `<div class="ov-modes">${modes.map(([m, l]) => `<button class="btn small ${ui.syl.mode === m ? "picked" : ""}" data-act="sylMode" data-m="${m}">${l}</button>`).join("")}</div>`)}`;
}

/* --- «Сколько стало?» (ступень С2, с 1.7.0): задачи в одно действие с числами до 10 ---
   Задачи — src/stories.js. Текст читает родитель: он внизу, в родительской полосе, крупно.
   Ребёнок видит картинку (что добавили — в оранжевой рамке, что ушло — бледное и зачёркнутое)
   и нажимает ответ из четырёх. Получилось — задача становится примером: «3 + 2 = 5».
   Круг — 5 задач по порядку списка: круг r — задачи 5r … 5r + 4 (по кругу), за 4 круга — все 20.
   Ответ засчитывается только с первого раза; итог — S.rounds «tasks», наклейка — «tasks». */
const ROUND = 5;

function openTasks() {
  const r = roundsOf("tasks").length;
  ui.tsk = { list: Array.from({ length: ROUND }, (_, i) => (r * ROUND + i) % STORIES.length), i: 0, firstOk: 0, end: false };
  newTask();
  showOverlay(); renderTasks();
}
function newTask() {
  const g = ui.tsk;
  Object.assign(g, { opts: answerOptions(STORIES[g.list[g.i]], 10), first: true, solved: false, off: [] });
}

/* Нажал ответ: не тот — кнопка качнётся и погаснет, Галочка подскажет */
function taskAnswer(el) {
  const g = ui.tsk, p = STORIES[g.list[g.i]], v = Number(el.dataset.v);
  if (g.solved || g.end || g.off.includes(v)) return;
  if (v !== p.ans) { g.first = false; g.off.push(v); el.disabled = true; flash(el, "nope"); again(); return; }
  if (g.first) g.firstOk++;
  g.solved = true; vibrate(40); cheer(); renderTasks();
}
/* Дальше; после пятой — итог круга, праздник и наклейка */
function taskNext() {
  const g = ui.tsk;
  if (!g.solved) return;
  g.i++;
  if (g.i >= g.list.length) { g.end = true; logRound("tasks", g.firstOk, ROUND); cheer("tasks"); }
  else newTask();
  renderTasks();
}

/* Картинка к задаче: было a; добавили b — в оранжевой рамке; ушли b — бледные и зачёркнутые */
function picture(p) {
  const thing = `<span class="tsk-thing">${thingSVG(p.obj)}</span>`;
  return p.op === "+"
    ? `<div class="tsk-pic" role="img" aria-label="${p.a} и ещё ${p.b}">${thing.repeat(p.a)}<span class="tsk-add">${thing.repeat(p.b)}</span></div>`
    : `<div class="tsk-pic" role="img" aria-label="Было ${p.a}, ${p.b} ушли">${thing.repeat(p.a - p.b)}<span class="tsk-gone">${thing.repeat(p.b)}</span></div>`;
}

function renderTasks() {
  const g = ui.tsk;
  let top, body, foot;
  if (g.end) {
    const list = roundsOf("tasks"), prev = list.length > 1 ? list[list.length - 2] : null;
    top = kidTop(say("yay"), "yay");
    body = `${winTitle("Круг пройден!")}
      <p class="cmp">С первого раза: ${g.firstOk} из ${ROUND}.</p>
      ${prev ? `<p class="cmp">В прошлый раз — ${prev.ok} из ${prev.of}.</p>` : ""}
      ${wonCard()}
      <button class="btn primary big narrow" data-act="openTasks">Ещё круг</button>`;
    foot = parentZone(`<p class="ov-tip">В следующем круге — новые истории.</p>`);
  } else {
    const p = STORIES[g.list[g.i]];
    const progress = steps(g.i, ROUND, `${g.i + 1} из ${ROUND}`);
    top = g.solved ? kidTop(say("ok"), "yay") : kidTop("Слушай!");
    body = g.solved
      ? `${winTitle(`${calcText(p)} = ${p.ans}`, 4)}${picture(p)}<button class="btn primary big narrow" data-act="taskNext">Дальше</button>${progress}`
      : `<p class="big-hand">${p.q}</p>${picture(p)}
        <div class="mult-opts">${g.opts.map(v => `<button class="mult-opt" data-act="taskAns" data-v="${v}"${g.off.includes(v) ? " disabled" : ""}>${v}</button>`).join("")}</div>
        ${progress}`;
    // число не отрывается от слова при переносе строки: «6 божьих коровок» — неразрывный пробел
    foot = parentZone(`<p class="tsk-text">${esc(p.t).replace(/(\d) /g, "$1\u00A0")}</p>`, g.solved ? "" : `<p class="ov-tip">Прочитай вслух. Он слушает, смотрит на картинку и нажимает ответ.</p>`);
  }
  ov().innerHTML = `${top}<div class="ov-center tsk">${body}</div>${foot}`;
}

/* Отметить запинку на слове. Повторное нажатие снимает отметку. */
function markStumble(i, quiet) {
  const w = normWord(ui.txt.words[i] || "");
  if (w.length < 3) {                                     // «у», «на», «и» — тренировать нечего
    if (!quiet) toast("Слишком короткое слово — не отмечаю");
    return;
  }
  const t = todayISO();
  if (ui.txt.marks.has(i) && !quiet) {                       // передумал — снимаем сегодняшнюю отметку

  stageSet(el) {                                 // ступень выбрана вручную — теперь она главная
    const line = el.dataset.line, n = Number(el.dataset.n);
    S.stage[line] = n; save(); render();
    toast(`${line === "read" ? "Чтение" : "Счёт"}: ${stageLabel(STAGES[line][n])}`);
  },
  stageAuto(el) { S.stage[el.dataset.line] = null; save(); render(); },   // снова по занятиям (rules.stageAuto)
  // Подсказка «пора на следующую ступень» (src/next-stage.js): «Перейти» — ступень вручную, «Пока рано» — до нового успеха
  stageNext(el) {
    const line = el.dataset.line, n = Number(el.dataset.n);
    S.stage[line] = n; save(); render();
    toast(`${line === "read" ? "Чтение" : "Счёт"}: ${stageLabel(STAGES[line][n])}`);
  },
  stageLater(el) {
    const h = nextHint(el.dataset.line);
    stageLater(el.dataset.line, Number(el.dataset.n), h ? h.day : el.dataset.d);
    render();
  },
  setPlan(el) {                                  // вид занятия: по ступеням или программа (src/plan.js)
    S.plan = el.dataset.v === "stages" ? "stages" : "program";
    ui.session = null; save(); render();
  },
  setSound(el) { S.sound = el.dataset.v === "1"; save(); render(); ding(); },   // включил — сразу слышно, какой он
  reset() {
    if (!ui.resetArmed) { ui.resetArmed = true; render(); return; }
    replaceState(clone(DEFAULT_STATE)); ui.resetArmed = false; ui.session = null; ui.screen = "home";
    flush(); render(); scrollTop();
  }
};

/* Один обработчик на все кнопки: находим ближайший data-act и вызываем действие */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
/* Поля замера недели сразу пишутся в черновик */
document.addEventListener("input", e => {
  const key = e.target.dataset && e.target.dataset.bind;
  if (key && ui.weeklyDraft) { const v = e.target.value.trim(); ui.weeklyDraft[key] = v === "" ? null : Number(v); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "nameInput" && !S.startDate) ACT.onboard();
  if (e.key === "Escape" && !ov().hidden) closeOverlay();          // на ноутбуке привычнее всего
});
/* Выбрали файл с данными — читаем и загружаем */
document.addEventListener("change", e => {
  if (e.target.id !== "fileInput" || !e.target.files || !e.target.files[0]) return;
  const reader = new FileReader();
  reader.onload = () => loadFromText(String(reader.result).trim());
  reader.onerror = () => toast("Не получилось открыть файл");
  reader.readAsText(e.target.files[0]);
  e.target.value = "";                                             // чтобы тот же файл можно было выбрать снова
});

"use strict";

/* =============================================================
   8. ЗАПУСК
   ============================================================= */
/* На своём хостинге или локальном сервере включаем офлайн-режим.
   На file:// служебные работники запрещены — просто пропускаем. */
if (location.protocol.startsWith("http") && "serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

  $("#app").innerHTML = `<p class="hint">Загрузка…</p>`;
  await loadState();
  render();
})();</script>
