/* ---------- Токены: цвета и шрифты ---------- */
:root{
  --paper:#FAFBFD;      /* лист тетради */
  --desk:#E8EDF5;       /* стол вокруг листа */
  --grid:#DCE5F2;       /* клетка */
  --line:#CBD5E6;       /* разделители */
  --ink:#2340B8;        /* синяя ручка — основной цвет */
  --ink-deep:#16297A;
  --graphite:#1D2433;   /* текст */
  --muted:#586174;      /* второстепенный текст */
  --green:#1C7F47;      /* зелёная ручка — всё, что получилось */
  --green-soft:#DDF1E4;
  --marker:#FFE35C;     /* маркер — подсветка слога */
  --margin:#E7686D;     /* красная линия полей */
  --sans:"Stupenki Sans","Verdana","Tahoma",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;   /* Stupenki Sans — это Andika */
  --hand:"Caveat","Stupenki Sans","Verdana",sans-serif;
  --cell:22px;          /* шаг клетки */
  --mx:34px;            /* ширина полей слева */
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--graphite);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.ov-open{overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button{font:inherit}
/* ---------- Лист тетради: клетка и красные поля ---------- */
.sheet{position:relative;max-width:640px;min-height:100vh;margin:0 auto;
  padding:22px 18px 64px calc(var(--mx) + 16px);
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg,transparent calc(var(--mx) - 1px),var(--margin) calc(var(--mx) - 1px),var(--margin) calc(var(--mx) + 1px),transparent calc(var(--mx) + 1px)),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100% 100%,var(--cell) var(--cell),var(--cell) var(--cell);
  box-shadow:0 0 0 1px #D3DBE8,0 18px 40px -24px rgba(22,41,122,.25)}
@media (min-width:700px){.sheet{margin:24px auto;min-height:calc(100vh - 48px);border-radius:4px}}
/* ---------- Типографика ---------- */
.hand{font-family:var(--hand);font-weight:700;color:var(--ink);line-height:1.05}
h1.hand{font-size:42px;margin:4px 0 6px}
h1.hand.big{font-size:64px}
h2.hand{font-size:30px;margin:0 0 8px}
h3{font-size:18px;line-height:1.3;margin:0 0 4px}
h4{font-size:16px;margin:10px 0 2px}
.sub{color:var(--muted);font-size:16px}
.lead{font-size:18px;margin:8px 0 14px;max-width:34em}
.hint{color:var(--muted);font-size:15px;margin:6px 0}
.green{color:var(--green)}
.answer{color:var(--green);font-size:15px;margin:4px 0}
.say{font-size:22px;font-weight:700;margin:8px 0}
.digits{font-size:34px;font-weight:700;letter-spacing:.2em;margin:6px 0;font-variant-numeric:tabular-nums}
/* ---------- План дня: номера и галочки стоят на полях ---------- */
.plan{list-style:none;margin:14px 0 18px;padding:0}
.plan li{position:relative;display:flex;align-items:baseline;gap:12px;min-height:44px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:18px}
.plan .t{flex:1}
.plan .min{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:16px}
.plan .mark{position:absolute;left:calc(-16px - var(--mx));top:8px;width:var(--mx);display:flex;justify-content:center;font-family:var(--hand);font-size:28px;line-height:1;color:var(--ink)}
.plan li.done .mark{color:var(--green)}
.plan li.done .t{color:var(--muted)}
/* ---------- Кнопки ---------- */
.btn{font-weight:700;font-size:16px;line-height:1.2;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:10px 16px;min-height:48px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:#fff}
.btn.big{display:flex;width:100%;min-height:60px;font-size:20px;border-radius:12px;margin:12px 0}
.btn.big.narrow{width:auto;min-width:220px}
.btn.small{min-height:40px;padding:6px 12px;font-size:15px}
.btn.ghost{background:transparent;border-color:transparent;padding-left:0;padding-right:0;text-decoration:underline;text-underline-offset:3px}
.btn.on{background:var(--green);border-color:var(--green);color:#fff}
.btn.picked{background:var(--graphite);border-color:var(--graphite);color:#fff}
.btn.danger{color:#A3262B;border-color:#A3262B}
.btn.grow{flex:1}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--ink-deep);outline-offset:3px}
.tool-row,.choice{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}
.tool-row.center{justify-content:center}
/* ---------- Главная ---------- */
.callout{margin:6px 0 16px;padding:12px 14px;background:#FFF8D6;border-left:4px solid var(--marker);border-radius:0 8px 8px 0}
.callout p{margin-bottom:8px}
.status{margin-top:26px}
.status p{margin-bottom:14px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0 10px}
.stairs{display:block;width:100%;max-width:280px;height:auto;margin:4px 0 8px}
.stairs path{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.stairs path.passed{stroke:var(--green)}
.stairs path.current{stroke:var(--ink)}
.stairs path.ahead{stroke:#AEBBD3;stroke-dasharray:4 5}
.stairs text{font:700 13px var(--sans);text-anchor:middle;fill:var(--muted)}
.stairs text.current{fill:var(--ink)}
.stairs circle{fill:var(--green)}
/* ---------- Экран занятия ---------- */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:-22px -18px 12px calc(-16px - var(--mx));padding:8px 18px 8px calc(var(--mx) + 16px);
  background-color:rgba(250,251,253,.96);
  background-image:linear-gradient(90deg,transparent calc(var(--mx) - 1px),var(--margin) calc(var(--mx) - 1px),var(--margin) calc(var(--mx) + 1px),transparent calc(var(--mx) + 1px));
  border-bottom:1px solid var(--line)}
.topbar .of{color:var(--muted);font-size:15px}
.timer{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:8px;min-height:44px;min-width:108px;justify-content:center;padding:6px 16px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.timer.running{background:var(--ink);color:#fff}
.timer.up{background:var(--marker);border-color:#E0B800;color:var(--graphite)}
.part{margin:26px 0}
.part > p{margin-bottom:10px}
.part > h3{margin-top:14px}
.ex{padding:12px 0 8px;border-top:1px dashed var(--line)}
.ex > p{max-width:60ch;margin-bottom:6px}
.note-btn{font-size:14px;color:var(--muted);background:none;border:0;padding:8px 0;min-height:36px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
details.more{margin:8px 0}
details.more > summary{cursor:pointer;list-style:none;color:var(--ink);font-weight:700;padding:8px 0;min-height:40px}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"+";display:inline-block;width:1.1em}
details.more[open] > summary::before{content:"−"}
.rules ol{padding-left:1.2em;margin:4px 0}
.rules li{margin:6px 0}
/* Нижняя панель «Назад / Дальше» прилипает к низу окна. Над ней — отступ на её высоту
   (--nav-h: кнопка 48 px + поля 14 и 12), чтобы конец блока прокручивался выше панели.
   Высоту и зазор проверяет tests/block-nav.spec.js */
.block-nav{--nav-h:74px;position:sticky;bottom:0;display:flex;gap:10px;margin-top:calc(30px + var(--nav-h));padding:14px 0 12px;background:linear-gradient(rgba(250,251,253,0),var(--paper) 35%)}
.tiles{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tiles span{width:50px;height:56px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;background:#fff;border:2px solid var(--ink);border-radius:6px}
.mini3{display:grid;grid-template-columns:repeat(3,46px);grid-auto-rows:46px;border:2px solid var(--graphite);width:max-content;margin:10px 0;background:#fff}
.mini3 span{border:1px solid var(--graphite);display:flex;align-items:center;justify-content:center}
.mini3 span.fly::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--graphite)}
.fig{display:block;margin:6px 0 4px;background:#fff;border:1px solid var(--line)}
.span-box{padding:8px 0 12px;border-bottom:1px dashed var(--line)}
.span-box:last-child{border-bottom:0}
.probe-list{padding-left:1.3em;margin:8px 0}
.probe-list li{margin:14px 0}
.praise{padding-left:1.1em;margin:8px 0}
.praise li{margin:10px 0;font-size:19px;color:var(--green)}
/* ---------- Формы и таблицы ---------- */
.field{display:block;margin:14px 0}
.field > span{display:block;font-size:15px;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=number],textarea{font:inherit;width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--graphite)}
input:focus,textarea:focus{border-color:var(--ink)}
textarea{resize:vertical;min-height:96px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}   /* поля — по нижнему краю, даже если подпись в две строки */
.grid3 .field{margin:6px 0}
.table-wrap{overflow-x:auto;margin:8px 0 14px}
.progress{border-collapse:collapse;width:100%;min-width:480px;background:#fff;font-variant-numeric:tabular-nums}
.progress th,.progress td{border:1px solid var(--line);padding:8px 6px;text-align:center;font-size:15px}
.progress th{font-size:13px;color:var(--ink);line-height:1.25;vertical-align:bottom}
.progress td:first-child{text-align:left;white-space:nowrap}
.progress td small{display:block;color:var(--muted);font-size:12px}
.progress td.up{color:var(--green);font-weight:700}
.notes{list-style:none;padding:0;margin:8px 0}
.notes li{padding:10px 0;border-bottom:1px dashed var(--line)}
.copybox{margin-top:10px;font-size:15px}
/* ---------- Детский экран: лист в клетку, одна задача ----------
   Как главный лист: клетка и красное поле слева. Само упражнение (таблица, текст,
   карточки) — белое, «вклеено» в лист. Сверху — Галочка (kids.css) и «Закрыть»,
   внизу под пунктиром — родительская полоса: мелкие подсказки и служебные кнопки. */
.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;
  --ovm:12px;                                                    /* где красная линия поля */
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg,transparent calc(var(--ovm) - 1px),var(--margin) calc(var(--ovm) - 1px),var(--margin) calc(var(--ovm) + 1px),transparent calc(var(--ovm) + 1px)),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100% 100%,var(--cell) var(--cell),var(--cell) var(--cell);
  background-attachment:local}
@media (min-width:700px){.overlay{--ovm:40px}}
.overlay[hidden]{display:none}
.ov-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px 8px calc(var(--ovm) + 10px);min-height:64px}
.ov-close{flex:none;width:44px;height:44px;padding:0;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.ov-close svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.ov-close:hover{color:var(--ink);border-color:var(--ink)}
.ov-find{font-size:17px;color:var(--muted)}
.ov-find b{font-size:30px;color:var(--ink);margin-left:4px;font-variant-numeric:tabular-nums}
.ov-body{flex:1;display:flex;align-items:center;justify-content:center;padding:4px 10px 18px;-webkit-tap-highlight-color:transparent}
.ov-body[data-act]{cursor:pointer;user-select:none}
.ov-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px 20px 18px;text-align:center}
.big-hand{font-family:var(--hand);font-weight:700;font-size:46px;line-height:1.05;color:var(--ink)}
.result{font-size:72px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.result span{font-size:24px;font-weight:400;color:var(--muted)}
.cmp{font-size:20px}
.ov-tip{text-align:center;color:var(--muted);font-size:14.5px;line-height:1.45;margin:0;max-width:36em}
.ov-modes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* Родительская полоса: под пунктиром, мелко, кнопки тихие — главное на экране для ребёнка */
.ov-parent{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 16px 12px;border-top:2px dashed #CDD7E8;text-align:center}
.ov-parent .tool-row{margin:0}
.ov-parent .btn{border-width:1.5px;border-color:#B6C3DA;color:#44506A;background:#fff}
.ov-parent .btn.picked{background:#E6ECFA;border-color:var(--ink);color:var(--ink)}
/* Низ экрана с текстом прилипает к краю окна: длинный текст прокручивается под ним */
.ov-foot{position:sticky;bottom:0;margin-top:auto;background:var(--paper);box-shadow:0 -12px 14px -14px rgba(29,36,51,.35)}
.overlay.sky .ov-foot{background:#F2F7FF}
.ov-main{display:flex;justify-content:center;padding:8px 16px 2px}

/* Главная кнопка детского экрана: синяя, с краешком снизу — нажимается «вглубь» */
.overlay .btn.primary{border-radius:14px;box-shadow:0 4px 0 var(--ink-deep)}
.overlay .btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink-deep)}
.overlay .btn.big{min-height:58px;font-size:21px;margin:2px 0 6px}

.schulte{--n:3;--side:min(94vw,calc(100vh - 150px));display:grid;grid-template-columns:repeat(var(--n),1fr);width:var(--side);height:var(--side);border:3px solid var(--graphite);background:#fff}
@supports (height:100dvh){.schulte{--side:min(94vw,calc(100dvh - 150px))}}
.schulte.s4{--n:4}
.schulte.s5{--n:5}
.sch-cell{font-family:var(--sans);font-weight:700;font-size:calc(var(--side) / var(--n) * .42);color:var(--graphite);background:#fff;border:1.5px solid var(--graphite);padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
.sch-cell.hit{animation:hit .4s ease-out}
.sch-cell.nope{animation:nope .3s ease-in-out}
@keyframes hit{from{background:var(--green-soft)}to{background:#fff}}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.syl{border-collapse:collapse;margin:0 auto;background:#fff;box-shadow:0 0 0 2px var(--ink)}
.syl td{font-family:var(--sans);font-weight:700;font-size:clamp(24px,8vw,56px);letter-spacing:.05em;padding:.16em .3em;text-align:center;border:1px solid #E1E6EF;transition:background-color .12s}
.syl.long td{font-size:clamp(20px,6vw,48px)}
/* Широкие буквы (Ж, Ш, Щ) и слоги из 4 букв: кегль считает renderSyl, чтобы таблица влезла в окно */
.syl.fit td{font-size:clamp(16px,var(--fit),48px)}
.syl.fit:not(.long) td{font-size:clamp(20px,var(--fit),56px)}
.syl td.cur{background:var(--marker);box-shadow:inset 0 -.14em 0 #EAC400}

/* Текст — белый лист поверх клетки: глазам ничто не мешает */
.reading{width:calc(100% - 24px);max-width:32ch;margin:0 auto 10px;padding:2px 14px 6px;background:#fff;border-radius:14px;
  box-shadow:0 0 0 1.5px #D3DCEA,2px 3px 0 rgba(35,64,184,.12);
  font-family:var(--sans);font-size:clamp(24px,6.6vw,38px);line-height:1.95;letter-spacing:.02em;word-spacing:.1em}
.reading[data-act]{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.reading .w{padding:.06em .08em;border-radius:4px;transition:opacity .12s,background-color .12s;scroll-margin:90px 0 200px}
.measure-wait{text-align:center;color:var(--muted);font-size:20px;padding:20px 20px 0}
.measure-res{padding:10px 18px 24px;text-align:center;font-size:18px}
.measure-res strong{color:var(--green)}

.toast{position:fixed;left:50%;bottom:22px;z-index:80;max-width:min(92vw,520px);padding:10px 16px;border-radius:10px;background:var(--graphite);color:#fff;font-size:15px;opacity:0;transform:translate(-50%,16px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ---------- Муха на экране ---------- */
.fly-stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.arrow{width:min(46vw,230px);height:auto}
.arrow path{fill:none;stroke:var(--ink);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.step-count{color:var(--muted);font-size:17px;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(3,1fr);width:min(84vw,330px);height:min(84vw,330px);border:3px solid var(--graphite);background:#fff}
.board button{position:relative;border:1.5px solid var(--graphite);background:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.board button.home::after{content:"";width:10%;height:10%;border-radius:50%;background:#C5CEDC}
.board .dot{width:30%;height:30%;border-radius:50%;background:var(--graphite)}
.board .dot.miss{width:24%;height:24%;background:#B7C5DE}
.record{color:var(--green);font-weight:700}
.lib{list-style:none;padding:0;margin:8px 0}
.lib li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.lib p{flex:1;font-size:15px;color:var(--muted)}
.lib p.used{opacity:.55}
/* ---------- Карточки тренажёров ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin:12px 0 22px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:7px;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:12px;min-height:116px;cursor:pointer;color:var(--graphite);font:inherit;box-shadow:2px 3px 0 rgba(35,64,184,.15);transition:transform .08s,box-shadow .08s}
.card:active{transform:translate(2px,3px);box-shadow:0 0 0 rgba(35,64,184,0)}
.card b{font-size:16.5px;color:var(--ink);line-height:1.2}
.card small{color:var(--muted);font-size:13.5px;line-height:1.35;margin-top:auto}
.ic{width:38px;height:38px;flex:none}
.ic path,.ic rect,.ic circle,.ic polyline,.ic line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic .thin{stroke-width:1.4;opacity:.55}
.ic .fill{fill:var(--ink);stroke:none}
.ic .mk{stroke:var(--marker);stroke-width:7;stroke-linecap:butt}
.ic text{font:700 12px var(--sans);fill:var(--ink);stroke:none}
.tool-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.tool-card h3{color:var(--ink)}
/* ---------- Ступени: тренажёры по ступеням, выбор в настройках, строка на главной ---------- */
/* Подписи групп в «Тренажёрах»: «Чтение · Ч6 «Тексты»», «Внимание и память» */
.tr-group{margin:16px 0 0;color:var(--ink)}
.tr-group + .cards{margin-top:8px}
.tr-group + .hint{margin-top:4px}
#d-all > .tool-card:last-child{margin-bottom:22px}
/* Ссылка внутри строки текста (строка ступеней на главной, «в настройках» в тренажёрах):
   на вид подчёркнутое слово, а нажимается выше и ниже, чем видно (по 11 px — и в мелкой
   строке подсказки выходит от 44 px), и высоту строки не меняет */
.link{display:inline-block;padding:11px 0;margin:-11px 0;border:0;background:none;color:var(--ink);font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* Выбор ступени в настройках: ступени столбиком, у каждой — что на ней осваиваем */
.stage-list{display:grid;gap:8px;margin:8px 0 4px}
.stage-opt{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:2px;width:100%;text-align:left}
.stage-opt small{font-weight:400;font-size:14px;line-height:1.35;color:var(--muted)}
.stage-opt.picked small{color:#E6EAF4}
/* ---------- Неделя и серия на главной ---------- */
.week{display:flex;gap:5px;margin:12px 0 4px}
.week div{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.week .box{height:36px;margin-top:4px;border:2px solid var(--line);border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--green)}
.week .box.on{border-color:var(--green);background:var(--green-soft)}
.week .box.today{border-color:var(--ink);border-style:dashed}
.week .box.today.on{border-style:solid}
.streak{display:inline-block;font-family:var(--hand);font-size:26px;color:var(--green);margin:4px 0 0}
/* ---------- График ---------- */
.chart{width:100%;height:auto;margin:6px 0 2px;background:#fff;border:1px solid var(--line);border-radius:10px}
.chart .bar{fill:#9FB0D0}
.chart .bar.good{fill:var(--green)}
.chart .bar.now{fill:var(--ink)}
.chart .goal{stroke:var(--green);stroke-width:1.5;stroke-dasharray:5 4}
.chart text{font:700 11px var(--sans);fill:var(--muted)}
.chart text.v{fill:var(--graphite)}
.chart text.g{fill:var(--green)}
/* ---------- Оживление ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.sheet.enter{animation:fadeUp .22s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}65%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.ov-center .result,.ov-center .big-hand{animation:pop .3s ease-out both}
@keyframes draw{to{stroke-dashoffset:0}}
.tick{width:92px;height:92px}
.tick path{fill:none;stroke:var(--green);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:120;stroke-dashoffset:120;animation:draw .4s .08s ease-out forwards}
.stamp{width:132px;height:132px;margin:6px auto 0;display:block}
.stamp circle{fill:none;stroke:var(--green);stroke-width:4;stroke-dasharray:400;stroke-dashoffset:400;animation:draw .7s ease-out forwards;opacity:.85}
.stamp path{fill:none;stroke:var(--green);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:120;stroke-dashoffset:120;animation:draw .4s .5s ease-out forwards}
/* Муха */
.overlay.sky{background-color:#F2F7FF}          /* Муха: лист чуть голубой, клетка и поле те же */
.cell-fly{position:absolute;inset:6%;display:flex;align-items:center;justify-content:center}
.flyart{width:100%;height:100%;overflow:visible}
.flyart .body{fill:url(#flyBody)}
.flyart .head{fill:#2B3A56}
.flyart .eye{fill:#D0483A}
.flyart .glint{fill:#fff;opacity:.9}
.flyart .stripe{stroke:#121B2E;stroke-width:3;fill:none;opacity:.45;stroke-linecap:round}
.flyart .leg{stroke:#1B2740;stroke-width:2.6;fill:none;stroke-linecap:round}
.flyart .wing{fill:#CFE4FB;stroke:#88A9D4;stroke-width:1.6;opacity:.88}
.flyart .wl{transform-origin:46px 58px;animation:flapL .13s infinite alternate ease-in-out}
.flyart .wr{transform-origin:54px 58px;animation:flapR .13s infinite alternate ease-in-out}
@keyframes flapL{from{transform:rotate(-36deg)}to{transform:rotate(-12deg)}}
@keyframes flapR{from{transform:rotate(36deg)}to{transform:rotate(12deg)}}
.cell-fly.away{animation:flewaway 1.4s .2s ease-in forwards}
@keyframes flewaway{to{transform:translate(130px,-110px) scale(.35) rotate(14deg);opacity:0}}
/* Камешки для пар */
.pebbles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:420px}
.pebble{width:52px;height:52px;border-radius:50%;border:3px solid #94A3BE;background:#E7ECF4;cursor:pointer;padding:0;transition:transform .1s}
.pebble.sel{transform:scale(1.15);border-color:var(--ink);box-shadow:0 0 0 4px rgba(35,64,184,.18)}
.pebble:disabled{cursor:default;opacity:.95}
/* Цепочка по два */
.numcards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:440px}
.numcard{min-width:58px;height:62px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--graphite);font-variant-numeric:tabular-nums}
.numcard.now{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.numcard.ask{background:var(--marker);border-color:#E0B800;font-size:30px;cursor:pointer}
.numcard.dim{border-style:dashed;border-color:#C7D2E4;background:transparent}
.numline{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:440px;margin-top:6px}
.numline span{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid var(--line);border-radius:6px;color:var(--muted);background:#fff}
.numline span.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.pips{display:flex;gap:6px;justify-content:center}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid #AEBBD3}
.pips i.on{background:var(--green);border-color:var(--green)}
.pips i.now{background:var(--ink);border-color:var(--ink);transform:scale(1.25)}
.reading .w.hit{background:#FFE0E2;box-shadow:inset 0 -.12em 0 var(--margin)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;font-size:17px}
.chip b{font-weight:700}
.chip small{color:var(--muted);font-size:13px}
.chip button{border:0;background:#F0F3F8;color:var(--muted);width:26px;height:26px;border-radius:50%;font-size:15px;line-height:1;cursor:pointer}
/* ---------- Рисунки на полях стола ----------
   Только когда по бокам от листа (640 px) есть место: окно шире 960 px.
   Закреплены, лежат под листом (стоят в разметке раньше него), нажатия
   пропускают насквозь. Приглушены прозрачностью: лист остаётся главным.
   Без анимации — движение по краям отвлекает. */
.desk{display:none}
@media (min-width:961px){
  :root{--desk:#EFEBE1}          /* тёплый стол: с зелёно-жёлтыми рисунками серо-голубой выходит холодным */
  .desk{display:block}
  .desk-side{position:fixed;top:0;bottom:0;width:calc(50% - 320px);display:flex;justify-content:center;padding:32px 16px;pointer-events:none}
  .desk-side.left{left:0}
  .desk-side.right{right:0}
  .desk svg{height:100%;max-width:100%;aspect-ratio:200/1040;opacity:.55;stroke-width:5}
}
.desk .ln{fill:none;stroke:var(--green);stroke-linecap:round;stroke-linejoin:round}
.desk .mkl{fill:none;stroke:var(--marker);stroke-linecap:round}
.desk .sf{fill:var(--green-soft);stroke:var(--green);stroke-width:4;stroke-linejoin:round}
.desk .pb{fill:var(--green);fill-opacity:.28;stroke:var(--green);stroke-width:4}
.desk .pp{fill:var(--paper);stroke:var(--green);stroke-width:4;stroke-linejoin:round}
.desk .mk{fill:var(--marker)}
.desk .mks{fill:var(--marker);stroke:var(--green);stroke-width:3.5;stroke-linejoin:round}
.desk .dt{fill:var(--green)}
.desk .tx{fill:var(--green);font-family:var(--hand);font-weight:700;text-anchor:middle}
/* ---------- «Убери звук»: слово — ряд фишек, по фишке на звук ---------- */
.snds{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.snd{width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);background:#E8EEFB;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.snd:disabled{cursor:default}
.snd.gone{background:transparent;border-style:dashed;border-color:#B8C2D6}
.snd.nope{animation:nope .3s ease-in-out}
.out-answer{font-family:var(--hand);font-weight:700;font-size:40px;line-height:1.1;color:var(--ink)}
/* ---------- Ступень 1 на экране: «Сколько в кулаке?» и «Сколько точек?» ---------- */
/* Камешки на столе и в открытом кулаке — те же, что в «Парах», только не нажимаются */
.hid-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:18px;max-width:440px}
.stones{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:280px}
.stone{display:inline-block;width:44px;height:44px;border-radius:50%;border:3px solid #94A3BE;background:#E7ECF4}
.stone.found{background:var(--green-soft);border-color:var(--green)}
.palm{padding:10px;border:2px dashed var(--green);border-radius:18px}
.fist{width:120px;height:120px;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fistart{width:100%;height:100%}
.fistart .hand{fill:#FFF1DE;stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.fistart .line{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;opacity:.7}
/* Всё число: строки камешков двух цветов */
.hid-sum{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.hid-sum li{display:flex;align-items:center;gap:14px}
.hid-sum b{font-size:22px;color:var(--ink);white-space:nowrap}
.stones.mini{gap:4px;max-width:none;flex-wrap:nowrap}
.stones.mini .stone{width:22px;height:22px;border-width:2px}

/* Домино: две половинки по 3×3 места для точек; перевёрнутое — в полоску */
.domino{display:flex;border:3px solid var(--graphite);border-radius:16px;background:#fff;padding:4px}
.domino .half{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8%;width:min(34vw,150px);height:min(34vw,150px);padding:12px;box-sizing:border-box}
.domino .half + .half{border-left:3px solid var(--graphite)}
.domino .half i{border-radius:50%}
.domino .half i.pip{background:var(--graphite)}
.domino.back{background:repeating-linear-gradient(45deg,#E7ECF4 0 12px,#fff 12px 24px)}

/* ---------- Таблица умножения ---------- */
.mult-cols{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:400px}
.mult-cols .btn{padding:8px 4px;font-size:18px}
.mult-cols .mix{grid-column:span 2}
.mult-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:100%;max-width:420px;font-size:13px;font-variant-numeric:tabular-nums}
.mult-grid span{display:flex;align-items:center;justify-content:center;height:28px;border-radius:4px;background:#fff;border:1px solid #E1E6EF;color:var(--muted)}
.mult-grid .head{border:0;background:transparent;color:var(--ink);font-weight:700}
.mult-grid .half{background:#EEF8F1;border-color:#A8D9B9;color:var(--green)}
.mult-grid .known{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}
.mult-grid .fresh{box-shadow:0 0 0 2.5px var(--marker)}          /* стали зелёными в этом круге */
/* Ряды точек: по n в ряду, k рядов; справа — сколько набралось */
.arr{display:grid;gap:6px;justify-items:start}
.arr-row{display:flex;align-items:center;gap:5px}
.arr-row i{width:16px;height:16px;border-radius:50%;background:var(--ink)}
.arr-row b{margin-left:10px;min-width:2.2em;font-size:16px;color:var(--green);font-variant-numeric:tabular-nums}
.mult-q{font-size:56px;font-weight:700;line-height:1.1;color:var(--graphite);font-variant-numeric:tabular-nums}
.mult-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:320px}
.mult-opt{font:700 32px var(--sans);padding:14px 6px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--graphite);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
.mult-opt:disabled{opacity:.35;cursor:default}
.mult-opt.nope{animation:nope .3s ease-in-out}
.mult-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,auto);gap:4px 28px;font-size:20px;font-variant-numeric:tabular-nums}
.mult-list b{color:var(--green)}
/* ---------- Счёт, с 1.7.0: «Посчитай», «Примеры до 10», «Через десяток», «Сколько стало?» ----------
   Разметка — src/overlays/count.js, calc.js, tasks.js; рисунки — src/count-art.js.
   Предметы — рисунки наклеек без высечки. В рамке-десятке первое число — точки синей ручкой,
   второе — оранжевые (не зелёные: зелёный — только «получилось»), что отняли — зачёркнуто,
   «через десяток» — маркером. Анимации — ещё и в reduced-motion.css и tests/motion.spec.js. */
.overlay{--dot2:#F08A3C}

/* Предмет — рисунок наклейки без белой высечки и без тени */
.stk.thing{display:block;width:100%;height:100%;filter:none}

/* «Посчитай»: белое поле, предметы лежат неровно (места — count.js, scatter) */
.cnt-field{position:relative;flex:none;width:100%;max-width:340px;height:220px;background:#fff;border-radius:16px;
  box-shadow:0 0 0 1.5px #D3DCEA,2px 3px 0 rgba(35,64,184,.12)}
.cnt-obj,.cnt-grp .cnt-thing{position:absolute;left:calc(var(--x) * 1% + var(--jx));top:calc(var(--y) * 1% + var(--jy));transform:translate(-50%,-50%)}
.cnt-obj{width:48px;height:48px;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cnt-obj:disabled{cursor:default}
/* Номер на предмете: посчитал пальцем — в уголке появилось число, сам предмет виден */
.cnt-obj b{position:absolute;right:-9px;top:-7px;min-width:25px;height:25px;padding:0 3px;border-radius:13px;
  background:#fff;border:2.5px solid var(--ink);color:var(--ink);font:700 15px/20px var(--sans);font-variant-numeric:tabular-nums;
  box-shadow:0 1px 2px rgba(29,36,51,.25)}
.cnt-obj b.new{animation:numPop .25s ease-out both}
@keyframes numPop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
/* Цифры 1–10: два ряда по пять */
.cnt-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:340px}
.cnt-key{min-height:50px;padding:0;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--graphite);
  font:700 26px var(--sans);font-variant-numeric:tabular-nums;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cnt-key:disabled{opacity:.35;cursor:default}
.cnt-key.nope{animation:nope .3s ease-in-out}

/* «Где больше?»: две кучки — две большие кнопки */
.cnt-two{display:flex;gap:12px;justify-content:center;width:100%;max-width:360px}
.cnt-grp{position:relative;flex:1;max-width:170px;aspect-ratio:4/5;padding:0;border:2.5px solid var(--ink);border-radius:18px;background:#fff;
  box-shadow:2px 3px 0 rgba(35,64,184,.15);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cnt-grp:disabled{opacity:.4;cursor:default}
.cnt-grp.nope{animation:nope .3s ease-in-out}
.cnt-thing{display:block;width:28px;height:28px}
.cnt-grp .cnt-thing{width:34px;height:34px}
/* После ответа — парами, в две строки; лишние — в зелёном кружке */
.cnt-pairs{display:grid;gap:8px;padding:10px 12px;background:#fff;border-radius:14px;box-shadow:0 0 0 1.5px #D3DCEA,2px 3px 0 rgba(35,64,184,.12)}
.cnt-row{display:flex;gap:2px}
.cnt-row .cnt-thing{border-radius:50%}
.cnt-row .cnt-thing.extra{background:var(--green-soft);box-shadow:0 0 0 2px var(--green)}

/* ---------- Рамка-десятка: 2 ряда по 5 клеток ---------- */
.tf{--c:44px;flex:none;display:grid;grid-template-columns:repeat(5,var(--c));grid-auto-rows:var(--c);background:#fff;
  border:2.5px solid var(--graphite);border-radius:6px;overflow:hidden}
.tf i{position:relative;border-right:1.5px solid #B9C3D6;border-bottom:1.5px solid #B9C3D6}
.tf i:nth-child(5n){border-right:0}
.tf i:nth-child(n+6){border-bottom:0}
.tf i.d::before{content:"";position:absolute;inset:15%;border-radius:50%;background:var(--ink)}
.tf i.o::before{background:var(--dot2)}
.tf i.hl{background:var(--marker)}
.tf i.x::before{opacity:.28}
.tf i.x::after{content:"";position:absolute;left:10%;right:10%;top:50%;margin-top:-1.5px;border-top:3px solid var(--graphite);border-radius:2px;transform:rotate(-45deg)}
/* Через десяток — две рамки рядом */
.tf2{display:flex;gap:10px;justify-content:center}
.tf2 .tf{--c:min(30px,8.2vw)}

/* Пример, цепочка «8 + 2 + 3», прошлый пример «В уме», выбор режима */
.calc-q{font-size:54px;font-weight:700;line-height:1.1;color:var(--graphite);font-variant-numeric:tabular-nums;white-space:nowrap}
.calc-chain{font-family:var(--hand);font-weight:700;font-size:34px;line-height:1.1;color:var(--ink);white-space:nowrap}
.calc-chain .hl{background:var(--marker);border-radius:6px;padding:0 6px}
.calc-prev{font-size:18px;font-weight:700;color:var(--green);margin:-4px 0}
.calc-modes{display:flex;gap:10px;width:100%;max-width:360px}
.calc-modes .btn{flex:1;min-height:58px;font-size:20px}
/* Таблица примеров для родителя: зелёные — выученные, светлые — получилось один раз, серые — не на этой ступени */
.calc-grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;width:100%;max-width:380px;font-size:13px;font-variant-numeric:tabular-nums}
.calc-grid span{display:flex;align-items:center;justify-content:center;height:25px;border-radius:4px;background:#fff;border:1px solid #E1E6EF;color:var(--muted)}
.calc-grid .head{border:0;background:transparent;color:var(--ink);font-weight:700}
.calc-grid .no{border:0;background:transparent}
.calc-grid .off{background:transparent;border-color:transparent;color:#B9C3D6}
.calc-grid .half{background:#EEF8F1;border-color:#A8D9B9;color:var(--green)}
.calc-grid .known{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}

/* ---------- «Сколько стало?» ---------- */
.tsk-pic{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;max-width:340px;padding:8px 10px;background:#fff;border-radius:14px;
  box-shadow:0 0 0 1.5px #D3DCEA,2px 3px 0 rgba(35,64,184,.12)}
.tsk-thing{position:relative;display:block;width:42px;height:42px}
.tsk-add,.tsk-gone{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.tsk-add{padding:2px 4px;border:2px dashed var(--dot2);border-radius:12px;background:#FFF4EA}
.tsk-gone .tsk-thing svg{opacity:.3}
.tsk-gone .tsk-thing::after{content:"";position:absolute;left:8%;right:8%;top:50%;margin-top:-1.5px;border-top:3px solid var(--graphite);border-radius:2px;transform:rotate(-45deg)}
.tsk-text{font-size:19px;line-height:1.4;color:var(--graphite);max-width:30em;text-align:center}

/* Низкий экран (360×640): всё помещается без прокрутки */
@media (max-height:700px){
  .cnt-keys{gap:6px}
  .cnt-key{min-height:46px;font-size:24px}
  .calc-q{font-size:44px}
  .calc-chain{font-size:30px}
  .tf{--c:40px}
  .calc-modes .btn{min-height:52px}
  .calc-grid span{height:21px}
  .tsk-thing{width:36px;height:36px}
  .tsk-text{font-size:17px}
}
/* ---------- Счёт дальше, с 1.7.0: «До 100» (С4), «Цепочки» (С5), «Деление» (С8) ----------
   Разметка — src/overlays/hundred.js, chain.js, division.js; картинки — src/hundred-data.js, src/div-data.js.
   Как в «Примерах до 10»: первое число — синей ручкой, второе — оранжевое (--dot2, не зелёное:
   зелёный — только «получилось»), что отняли — зачёркнуто, «собираем десяток» — маркером.
   Анимации — ещё и в reduced-motion.css и tests/motion.spec.js. */

/* ---------- «До 100»: пучки и палочки ---------- */
.hund-pic{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:flex-end;justify-content:center;max-width:350px;padding:10px 12px 6px;
  background:#fff;border-radius:14px;box-shadow:0 0 0 1.5px #D3DCEA,2px 3px 0 rgba(35,64,184,.12)}
.hund-grp{display:flex;flex-direction:column;align-items:center;gap:2px}
.hund-grp small{font-size:12px;line-height:1.2;color:var(--muted)}
.hund-row{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;max-width:320px}
.hund-pic .a{color:var(--ink)}
.hund-pic .b{color:var(--dot2)}
/* Пучок: 10 палочек, стянутых посередине красной лентой (рисунок — BUNDLE в src/hundred-data.js) */
.bundle{position:relative;display:block;width:28px;height:56px}
.bundle svg{display:block;width:100%;height:100%;overflow:visible}
.bundle path{fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round}
.bundle rect{fill:var(--margin);stroke:#fff;stroke-width:1}
/* Палочка */
.stick{position:relative;display:block;width:4px;height:56px;border-radius:2px;background:currentColor}
/* Маркером — собираем новый пучок или развязанный пучок; полоса маркера непрерывная */
.stick.hl{box-shadow:0 0 0 3px var(--marker)}
/* Отняли — бледное и зачёркнутое */
.bundle.x,.stick.x{opacity:.3}
.bundle.x::after,.stick.x::after{content:"";position:absolute;left:50%;top:50%;width:30px;margin:-1.5px 0 0 -15px;border-top:3px solid var(--graphite);
  border-radius:2px;transform:rotate(-55deg)}
.stick.x::after{width:14px;margin-left:-7px}
.hund-say{font-size:19px;color:var(--graphite);margin:-4px 0 0}
.hund-modes{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.hund-modes .btn{min-height:54px;font-size:20px}
/* «Столбиком»: три столбца клеток — знак, десятки, единицы; точка над десятками; черта; ответ.
   Клетка, которую пишем, — маркером. Клетки — как в тетради, крупные */
.col-ex{--k:50px;display:grid;grid-template-columns:repeat(3,var(--k));grid-auto-rows:var(--k);padding:4px 10px;background:#fff;border-radius:14px;
  box-shadow:0 0 0 1.5px #D3DCEA,2px 3px 0 rgba(35,64,184,.12);
  background-image:linear-gradient(#E3E9F4 1px,transparent 1px),linear-gradient(90deg,#E3E9F4 1px,transparent 1px);
  background-size:var(--k) var(--k);background-position:10px 4px}
.cc{display:flex;align-items:center;justify-content:center;font:700 34px/1 var(--sans);color:var(--graphite);font-variant-numeric:tabular-nums}
.cc.sign{color:var(--ink)}
.cc.ans{color:var(--ink)}
.cc.ans.now{background:var(--marker);border-radius:8px;box-shadow:inset 0 -3px 0 #EAC400}
.cc.under{box-shadow:inset 0 -3px 0 var(--graphite)}        /* черта под вторым числом */
.col-dot{display:block;width:12px;height:12px;border-radius:50%;background:var(--ink);align-self:end;margin-bottom:6px}

/* ---------- «Цепочки»: ряды сотни и выбор цепочки ----------
   Лента цепочки по 2 вперёд — прежняя (.numline, 1–20, extras.css). У остальных цепочек — ряды сотни
   по 10 чисел: по 10 видно столбиком, по 5 — двумя столбиками */
.numline.rows{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:100%;max-width:340px}
.numline.rows span{width:auto;height:28px}
.numline.rows.tall span{height:24px;font-size:12.5px}
.chain-pick{display:flex;gap:14px;justify-content:center;width:100%;max-width:340px}
.chain-col{flex:1;display:flex;flex-direction:column;gap:9px}
.chain-head{font-family:var(--hand);font-weight:700;font-size:26px;line-height:1.1;color:var(--ink)}
.chain-kind{min-height:54px;font-size:22px;font-variant-numeric:tabular-nums}
.chain-kind.half{background:#EEF8F1;border-color:#A8D9B9;color:var(--green)}
.chain-kind.known{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.numcard.ask.nope{animation:nope .3s ease-in-out}

/* ---------- «Деление»: «Поровну» — кучка и тарелки; примеры, подсказка, таблица ---------- */
.share-pile{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:330px;padding:8px 10px;background:#fff;border-radius:14px;
  box-shadow:0 0 0 1.5px #D3DCEA,2px 3px 0 rgba(35,64,184,.12)}
.share-thing{display:block;width:30px;height:30px}
.plates{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:330px}
.plates.k3{grid-template-columns:repeat(3,1fr)}
/* Тарелка: белая, с ободком; предметы на ней — кучкой посередине */
.plate{min-height:86px;padding:12px 10px;border:2.5px solid var(--ink);border-radius:50%;background:#fff;
  box-shadow:inset 0 0 0 7px #EEF2FA,2px 3px 0 rgba(35,64,184,.15);display:flex;align-items:center;justify-content:center;
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.plate:disabled{cursor:default}
.plate.wait{border-color:#B6C3DA;box-shadow:inset 0 0 0 7px #F3F5FA}       /* уже получила — ждёт, пока раздадим всем */
.plate.nope{animation:nope .3s ease-in-out}
.plate-in{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:100px}
.plate .share-thing{width:28px;height:28px}
.div-cols{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:400px}
.div-cols .btn{padding:8px 4px;font-size:18px;font-variant-numeric:tabular-nums}
.div-hint{font-size:28px;font-weight:700;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}

@media (max-height:700px){
  .bundle,.stick{height:46px}
  .hund-say{font-size:17px}
  .hund-modes{gap:8px}
  .hund-modes .btn{min-height:48px;font-size:19px}
  .col-ex{--k:44px}
  .cc{font-size:30px}
  .numline.rows span{height:24px}
  .numline.rows.tall span{height:20px;font-size:11.5px}
  .chain-kind{min-height:48px}
  .share-thing{width:27px;height:27px}
  .plate{min-height:80px;padding:8px}
  .plate .share-thing{width:25px;height:25px}
  .div-grid span{height:19px}
  .div-hint{font-size:24px}
  /* подсказка к 90 : 9 — десять рядов: точки и подписи плотнее, пример и ответы чуть ниже */
  .div .arr{gap:4px}
  .div .arr-row i{width:13px;height:13px}
  .div .arr-row b{font-size:13px;line-height:13px}
  .div .mult-q{font-size:44px}
  .div .mult-opt{padding:10px 6px}
}
/* ---------- Картинки (src/pictures.js), «Звуки» и «Буквы» ----------
   Картинка — синей ручкой: контур одной толщины, скруглённые концы, одна мягкая заливка
   из палитры наклеек (kids.css). Зелёной заливки нет: зелёный — только «получилось». */
.pic{display:block;width:100%;height:100%;overflow:visible}
.pic *{fill:none;stroke:var(--ink);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.pic .w{fill:#fff}
.pic .f{fill:var(--pf,#fff)}
.pic .i{fill:var(--ink);stroke:none}
.pic .g{fill:#fff;stroke:none}
.pic.c-yel{--pf:#FFE27A}
.pic.c-red{--pf:#FFA197}
.pic.c-blu{--pf:#A9CCFF}
.pic.c-sky{--pf:#D6E7FF}
.pic.c-org{--pf:#FFC28C}
.pic.c-pnk{--pf:#FFBCD6}
.pic.c-lil{--pf:#DCD3FF}
.pic.c-pch{--pf:#FFE0BF}

/* «Звуки»: три картинки в ряд — крупные кнопки на белом, как вклеенные в лист */
.pics{display:flex;gap:10px;justify-content:center;width:100%}
.pic-btn{flex:none;width:min(29vw,132px);height:min(29vw,132px);padding:min(3vw,14px);border:2.5px solid #D3DCEA;border-radius:18px;background:#fff;
  box-shadow:2px 3px 0 rgba(35,64,184,.12);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pic-btn:disabled{opacity:.3;cursor:default}
.pic-btn.ok{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft);opacity:1}
.pic-btn.nope{animation:nope .3s ease-in-out}
/* «Звуки в слове»: одна картинка покрупнее, под ней фишки (.snd из «Убери звук») */
.pic-one{width:min(40vw,160px);height:min(40vw,160px);padding:12px;background:#fff;border-radius:18px;box-shadow:0 0 0 1.5px #D3DCEA,2px 3px 0 rgba(35,64,184,.12)}
.snd.lit{background:var(--marker)}
.snd-names{display:block}

/* «Буквы»: все 33 одной полосой — зелёные, светлые, обведённые (знакомые) и серые */
.abc-strip{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;width:100%;max-width:400px}
.abc-strip span{display:flex;align-items:center;justify-content:center;height:30px;border-radius:6px;border:1.5px solid transparent;
  background:#E9EDF4;color:#98A3B6;font-weight:700;font-size:16px;line-height:1}
.abc-strip .open{background:#fff;border-color:var(--ink);color:var(--ink)}
.abc-strip .half{background:#EEF8F1;border-color:#A8D9B9;color:var(--green)}
.abc-strip .known{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.abc-strip .fresh{box-shadow:0 0 0 2.5px var(--marker)}
/* Новая буква: заглавная и строчная крупно, рядом картинка на её звук, под ними — ещё слова */
.abc-card{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 16px;background:#fff;border-radius:18px;
  box-shadow:0 0 0 1.5px #D3DCEA,2px 3px 0 rgba(35,64,184,.12)}
.abc-pair{font-family:var(--sans);font-weight:700;font-size:min(21vw,92px);line-height:1.1;color:var(--ink);white-space:nowrap}
.abc-pic{width:min(30vw,118px);height:min(30vw,118px)}
.abc-more{display:flex;gap:10px;justify-content:center}
.abc-mini{display:block;width:58px;height:58px;padding:6px;background:#fff;border-radius:12px;box-shadow:0 0 0 1.5px #D3DCEA}
/* Найди букву: шесть крупных букв, три в ряд */
.abc-six{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:330px}
.abc-btn{height:min(24vw,96px);padding:0;border:2.5px solid var(--ink);border-radius:16px;background:#fff;color:var(--graphite);
  font:700 min(14vw,58px)/1 var(--sans);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:2px 3px 0 rgba(35,64,184,.15)}
.abc-btn:disabled{opacity:.3;cursor:default}
.abc-btn.ok{border-color:var(--green);background:var(--green-soft);color:var(--green);opacity:1}
.abc-btn.nope{animation:nope .3s ease-in-out}

/* Низкий экран (360×640): всё на одном экране, без прокрутки */
@media (max-height:700px){
  .pic-one{width:min(36vw,128px);height:min(36vw,128px);padding:9px}
  .abc-btn{height:min(21vw,84px)}
  .abc-strip span{height:27px;font-size:15px}
  .abc-pair{font-size:min(19vw,84px)}
  .abc-pic{width:min(27vw,104px);height:min(27vw,104px)}
  .abc-mini{width:50px;height:50px;padding:5px}
}
/* ---------- Чтение дальше букв (с 1.7.0): «Слоги из букв», «Слова и фразы», «Предложения» ----------
   Разметка — src/overlays/merge.js, words3.js, sentences.js. Картинки и кнопки-картинки (.pic, .pic-btn,
   .pic-one) — из abc.css. Новые анимации — ещё и в reduced-motion.css и tests/motion.spec.js. */
:root{--vowel:#D23C49}        /* гласная в слоге — красная, как в букваре; согласная — синей ручкой */

/* «Слияние»: слог на белой карточке. Согласная подъезжает к гласной (в обратном слоге — справа),
   когда слились — под слогом появляется дужка. Нажал на карточку — подъезжает снова */
.mg-card{display:flex;flex-direction:column;align-items:center;width:min(86vw,340px);padding:6px 0 4px;border:0;border-radius:20px;background:#fff;
  box-shadow:0 0 0 1.5px #D3DCEA,2px 3px 0 rgba(35,64,184,.12);overflow:hidden;cursor:pointer;font:inherit;color:inherit;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mg-syl{display:flex;justify-content:center;font:700 min(30vw,124px)/1.1 var(--sans);letter-spacing:.03em}
.mg-syl .c{color:var(--ink);animation:rideIn .9s .2s cubic-bezier(.3,.1,.25,1) both}
.mg-syl .v{color:var(--vowel)}
.mg-syl.rev .c{animation-name:rideInR}
@keyframes rideIn{from{transform:translateX(-.8em)}to{transform:none}}
@keyframes rideInR{from{transform:translateX(.8em)}to{transform:none}}
.mg-arc{display:block;width:min(46vw,190px);height:26px;margin-top:-6px;animation:arcIn .3s 1.05s both}
.mg-arc path{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round}
@keyframes arcIn{from{opacity:0}to{opacity:1}}
.mg-wait{font-family:var(--hand);font-weight:700;font-size:32px;line-height:1.1;color:var(--ink)}
/* 20 точек хода — помельче, чтобы встали в одну строку (сильнее, чем .steps .pips в kids.css) */
.mg-steps .steps .pips{gap:4px}
.mg-steps .steps .pips i{width:8px;height:8px;border-width:1.5px}
/* «Найди слог»: до шести слогов, три в ряд */
.mg-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:330px}
.mg-opt{height:min(22vw,88px);padding:0;border:2.5px solid var(--ink);border-radius:16px;background:#fff;color:var(--graphite);
  font:700 min(11vw,46px)/1 var(--sans);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:2px 3px 0 rgba(35,64,184,.15)}
.mg-opt:disabled{opacity:.3;cursor:default}
.mg-opt.ok{border-color:var(--green);background:var(--green-soft);color:var(--green);opacity:1}
.mg-opt.nope{animation:nope .3s ease-in-out}

/* «Слова и фразы»: слово крупно (длинное — помельче), фраза, «Да» и «Нет» */
.w3-word{margin:0;font:700 min(17vw,72px)/1.15 var(--sans);color:var(--graphite);letter-spacing:.02em}
.w3-word.mid{font-size:min(14vw,60px)}
.w3-word.long{font-size:min(11vw,48px)}
.w3-card{padding:14px 26px;background:#fff;border-radius:20px;box-shadow:0 0 0 1.5px #D3DCEA,2px 3px 0 rgba(35,64,184,.12)}
.w3-phrase{font:700 min(9vw,38px)/1.25 var(--sans);color:var(--graphite);max-width:16em}
.w3-two .pic-btn{width:min(38vw,150px);height:min(38vw,150px)}
.w3-yn{display:flex;gap:14px;justify-content:center}
.yn-btn{min-width:min(34vw,140px);padding:12px 18px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;color:var(--graphite);
  font:700 32px/1 var(--sans);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:2px 3px 0 rgba(35,64,184,.15)}
.yn-btn:disabled{opacity:.3;cursor:default}
.yn-btn.ok{border-color:var(--green);background:var(--green-soft);color:var(--green);opacity:1}
.yn-btn.nope{animation:nope .3s ease-in-out}

/* «Предложения»: текст на белом листе, каждое предложение с новой строки; вопрос и три ответа */
.snt-name{font-size:36px}
.snt-text{width:min(100%,560px);padding:10px 16px;background:#fff;border-radius:16px;box-shadow:0 0 0 1.5px #D3DCEA,2px 3px 0 rgba(35,64,184,.12);
  text-align:left;font-family:var(--sans);font-size:clamp(20px,5.9vw,30px);line-height:1.4;letter-spacing:.01em;color:var(--graphite)}
.snt-text p{margin:0 0 .35em}
.snt-text p:last-child{margin-bottom:0}
.snt-q{font:700 min(7.6vw,32px)/1.25 var(--sans);color:var(--graphite);max-width:18em}
.snt-opts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px}
.snt-opt{min-height:56px;padding:10px 14px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;color:var(--graphite);
  font:700 min(6.4vw,26px)/1.2 var(--sans);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:2px 3px 0 rgba(35,64,184,.15)}
.snt-opt:disabled{opacity:.3;cursor:default}
.snt-opt.ok{border-color:var(--green);background:var(--green-soft);color:var(--green);opacity:1}
.snt-opt.nope{animation:nope .3s ease-in-out}

/* Низкий экран (360×640): всё на одном экране, без прокрутки */
@media (max-height:700px){
  .mg-syl{font-size:min(27vw,110px)}
  .mg-opt{height:min(19vw,74px)}
  .mg-wait{font-size:28px}
  .w3-word{font-size:min(15vw,62px)}
  .w3-word.mid{font-size:min(12.5vw,52px)}
  .w3-word.long{font-size:min(10vw,42px)}
  .w3-two .pic-btn{width:min(34vw,128px);height:min(34vw,128px)}
  .yn-btn{padding:10px 16px;font-size:28px}
  .snt-name{font-size:30px}
  .snt-text{font-size:clamp(19px,5.9vw,26px);line-height:1.32;padding:8px 14px}
  .snt-text p{margin-bottom:.3em}
  .snt-opt{min-height:50px}
}
/* ---------- Входная проверка и сетка букв ----------
   Сетка из 33 букв (src/overlays/letter-grid.js) — во входной проверке и в «Буквах»: «какие буквы он уже
   знает», отмеченные зелёные. Детский экран проверки — «Покажи, что умеешь» (.chk), экраны родителя —
   начало и итог (.check-…). Анимаций своих нет: качание «не тот ответ» — общее (nope). */
.abc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:calc(100% + 24px);max-width:400px;margin:0 -12px}
.abc-key{height:50px;padding:0;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--graphite);
  font:700 26px var(--sans);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.abc-key.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}

/* Слоги, слова и трудные слоги — читает вслух, всё сразу на белой карточке */
.chk-read{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;width:min(100%,520px);padding:14px 18px;background:#fff;border-radius:16px;
  box-shadow:0 0 0 1.5px #D3DCEA,2px 3px 0 rgba(35,64,184,.12);font:700 min(11vw,46px)/1.25 var(--sans);color:var(--graphite);letter-spacing:.02em}
.chk-read.words{font-size:min(8.6vw,38px)}
.chk .calc-q{font-size:min(11vw,54px)}
.chk .calc-q .win{color:var(--green)}
.chk-text{font-size:clamp(17px,4.8vw,22px);line-height:1.35}
.chk-where{font-size:13px;margin:0}

/* Экраны родителя: начало и итог */
.check-steps{margin:0 0 12px;padding-left:22px}
.check-steps li{margin-bottom:8px}
.check-sum{font-size:20px}
.check-list{margin:0 0 8px;padding-left:22px}
.check-list li{margin-bottom:4px}
.check-list li.ok::marker{color:var(--green)}
.check-list li.stop{color:var(--ink)}
.check-offer .tool-row{margin:0}

@media (max-height:700px){
  .chk .big-hand{font-size:36px}
  .chk.ov-center{gap:10px;padding-top:6px;padding-bottom:10px}
  .abc-grid{gap:5px}
  .abc-key{height:44px;font-size:23px}
  .chk-read{font-size:min(10vw,40px)}
  .chk-read.words{font-size:min(8vw,32px)}
  .chk .calc-q{font-size:min(10vw,44px)}
  .chk-text{font-size:16.5px;line-height:1.3;padding:6px 12px}
  .chk-text p{margin-bottom:.2em}
}
/* ---------- Детские экраны: Галочка, праздник, наклейки ----------
   Рисунки — src/kids-art.js, разметка — src/overlays/kids.js и stickers.js.
   Линии — синей ручкой (--ink), «получилось» — зелёной (--green), заливки — мягкие,
   как цветными карандашами. Новые анимации — ещё и в reduced-motion.css. */

/* Галочка: птичка с крылом-галочкой, сидит в верхней строке */
.kid{display:flex;align-items:center;gap:10px;min-width:0}
.bird{width:46px;height:46px;flex:none;overflow:visible}
.bird .bd{fill:#fff;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.bird .ln{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bird .bk{fill:var(--marker);stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.bird .ey{fill:var(--ink)}
.bird .gl{fill:#fff}
.bird .ck{fill:#FFB3B8;opacity:.8}
.bird .wg{fill:none;stroke:var(--ink);stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
.kid.yay .bird .wg{stroke:var(--green)}
@keyframes hop{0%,100%{transform:none}35%{transform:translateY(-7px) rotate(-6deg)}70%{transform:translateY(1px)}}
.kid.yay .bird{animation:hop .5s ease-out;transform-origin:50% 90%}

/* Что говорит Галочка: облачко с хвостиком в её сторону */
.kid-say{position:relative;min-width:0;font-family:var(--hand);font-weight:700;font-size:24px;line-height:1.1;color:var(--ink);
  background:#fff;border:2px solid var(--ink);border-radius:14px;padding:4px 12px 6px;overflow-wrap:anywhere}
.kid-say::before{content:"";position:absolute;left:-7px;top:50%;width:10px;height:10px;margin-top:-6px;background:#fff;
  border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.kid.yay .kid-say{color:var(--green);border-color:var(--green)}
.kid.yay .kid-say::before{border-color:var(--green)}
.kid-say .ov-find{font-size:inherit;color:inherit}
.kid-say .ov-find b{font-family:var(--sans);font-size:28px;margin-left:2px;color:var(--ink)}

/* Звёздочки синей ручкой: вспыхивают один раз вокруг заголовка и остаются, без мигания */
.cheer{position:relative;display:inline-block;max-width:100%;padding:8px 28px 4px}
.stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;width:var(--s,16px);height:var(--s,16px);margin:calc(var(--s,16px) / -2) 0 0 calc(var(--s,16px) / -2);overflow:visible;
  transform:rotate(var(--r,0deg));animation:starPop .5s calc(var(--i,0) * 70ms) ease-out both}
.star path{fill:#FFF1A8;stroke:var(--ink);stroke-width:1.7;stroke-linejoin:round}
@keyframes starPop{0%{transform:rotate(var(--r,0deg)) scale(0);opacity:0}60%{transform:rotate(var(--r,0deg)) scale(1.25);opacity:1}100%{transform:rotate(var(--r,0deg)) scale(1);opacity:1}}
.big-hand.win{color:var(--green)}

/* Наклейки: белая высечка, мягкая тень, рисунок ручкой и цветными карандашами */
.stk{display:block;overflow:visible;filter:drop-shadow(0 1.5px 1.2px rgba(29,36,51,.25))}
.stk .cut *{fill:#fff;stroke:#fff;stroke-width:15;stroke-linejoin:round;stroke-linecap:round}
.stk .art .o{fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round}
.stk .art .t{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.stk .art .i{fill:var(--ink)}
.stk .art .w{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;opacity:.9}
.stk .art .w-dot{fill:#fff}
.stk .art .ck{fill:#FF9EAA;opacity:.75}
.stk .art .f-yel{fill:#FFE27A}
.stk .art .f-red{fill:#FFA197}
.stk .art .f-grn{fill:#A9DDB4}
.stk .art .f-blu{fill:#A9CCFF}
.stk .art .f-sky{fill:#D6E7FF}
.stk .art .f-org{fill:#FFC28C}
.stk .art .f-pnk{fill:#FFBCD6}
.stk .art .f-lil{fill:#DCD3FF}
.stk .art .f-pch{fill:#FFE0BF}
.stk .art .f-wht,.stk .art .f-paper{fill:#fff}
.stk .art .f-ink{fill:var(--ink)}
.stk .art .g{fill:none;stroke:#BCD1F0;stroke-width:1.6}         /* кораблик сложен из листа в клетку */
.stk .art .m{fill:none;stroke:var(--margin);stroke-width:1.8}
/* Пустое место в альбоме: только контур, как напечатанный силуэт */
.stk.ghost{filter:none}
.stk.ghost .art *{fill:none;stroke:#C4CEDF;stroke-width:2.6;stroke-dasharray:5 5}
.stk.ghost .art .w,.stk.ghost .art .w-dot,.stk.ghost .art .ck,.stk.ghost .art .i{display:none}
.stk.ghost .art .g,.stk.ghost .art .m{display:none}

/* Новая наклейка в конце круга: крупно, «прихлопнута» на лист; нажал — альбом */
.sticker-win{display:inline-flex;align-items:center;gap:12px;padding:6px 18px 6px 10px;border:2px dashed #A9BCE0;border-radius:16px;
  background:rgba(255,255,255,.75);cursor:pointer;font:inherit;color:var(--ink);touch-action:manipulation}
.sticker-win .stk{width:60px;height:60px;transform:rotate(-6deg);animation:slap .5s .2s cubic-bezier(.2,1.4,.4,1) both}
.sticker-win span{font-family:var(--hand);font-weight:700;font-size:26px;line-height:1.1}
@keyframes slap{0%{transform:scale(1.9) rotate(-22deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
/* Наклейка в верхней строке — у тренажёров без конца круга (слоги, мои слова) */
.kid-stk{flex:none;width:46px;height:46px;padding:3px;border:0;background:none;cursor:pointer;touch-action:manipulation}
.kid-stk .stk{width:100%;height:100%;transform:rotate(-8deg);animation:slap .5s cubic-bezier(.2,1.4,.4,1) both}

/* Точки хода: сколько пройдено в круге */
.steps{display:flex;flex-direction:column;align-items:center;gap:3px}
.steps .pips{gap:7px}
.steps .pips i{width:11px;height:11px}
.steps .step-count{font-size:14px}

/* Альбом «Мои наклейки»: 12 мест; пустое — пунктирный силуэт */
.album{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:460px}
.album li{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px 6px;
  border:2px dashed #D3DCEA;border-radius:14px;background:rgba(255,255,255,.6)}
.album li.got{border-color:transparent;background:transparent}
.album .stk{width:min(84px,96%);height:auto;aspect-ratio:1}
.album li.got .stk{transform:rotate(var(--tilt,0deg))}
.album .nm{font-size:13px;line-height:1.15;color:#44506A;overflow-wrap:anywhere}
.album .cnt{position:absolute;top:0;right:0;min-width:30px;padding:0 6px;border-radius:999px;background:#fff;border:1.5px solid var(--ink);
  color:var(--ink);font-size:13.5px;line-height:20px;font-variant-numeric:tabular-nums}
.album .new{position:absolute;top:-6px;left:-2px;font-family:var(--hand);font-style:normal;font-weight:700;font-size:17px;line-height:1;color:var(--green);transform:rotate(-10deg)}
/* ---------- Телефон и планшет ----------
   Почти всё здесь срабатывает только там, где нужно: на сенсорном экране
   (pointer:coarse), в узком окне (уже 400 px) или в низком (ниже 700 px).
   В окне 420×860 с мышью, как в тестах, эти правила молчат, и эталонные снимки
   в tests/__screenshots__ остаются верными. Без условий — только отступы под
   вырез экрана (на компьютере они нулевые), поле даты и итог замера чтения:
   их нет ни на одном эталонном снимке. Проверяет tests/mobile.spec.js. */

/* Вырез камеры и полоска «домой» внизу экрана. В index.html стоит viewport-fit=cover,
   значит отступы берём сами. На компьютере и на телефонах без выреза env() = 0. */
.ov-top{padding-left:max(calc(var(--ovm) + 10px),env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.overlay{padding-bottom:env(safe-area-inset-bottom)}
.block-nav{--nav-h:calc(74px + env(safe-area-inset-bottom));padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.toast{bottom:calc(22px + env(safe-area-inset-bottom))}

/* Дата «проверки с бумаги» — такая же, как остальные поля, а не мелкая системная */
.field input[type=date]{font:inherit;max-width:100%;min-height:44px;padding:8px 12px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--graphite)}

/* Итог замера чтения не уходит под край низкого окна (телефон 360×640, ноутбук
   с экраном 768 px): прилипает к низу экрана, а текст над ним прокручивается.
   Белая растушёвка сверху видна, только когда под итогом есть текст. */
.measure-res{position:sticky;bottom:0;padding-top:22px;background:linear-gradient(rgba(255,255,255,0),#fff 22px)}

/* Палец толще курсора: всё, что нажимается, — не меньше 44×44 px */
@media (pointer:coarse){
  .btn.small{min-height:44px;min-width:44px}
  .note-btn,.ov-close,.ov-peek{min-height:44px}
  /* Крестик на слове остаётся маленьким на вид, а нажимается вокруг — 44×44 */
  .chip button{position:relative}
  .chip button::after{content:"";position:absolute;inset:-9px}
}

/* Узкий телефон (360 px): карточки тренажёров — в две колонки, а не в одну длинную */
@media (max-width:399px){
  .cards{grid-template-columns:1fr 1fr}
}

/* Низкий экран (360×640): детский экран целиком, без прокрутки */
@media (max-height:700px){
  .ov-top{min-height:52px;padding-top:6px;padding-bottom:6px}
  .ov-center{gap:8px;padding:10px 16px}
  .big-hand{font-size:38px}
  /* Галочка, наклейка и длинные экраны (цепочка, конец круга умножения) — чуть плотнее */
  .bird{width:42px;height:42px}
  .kid-say{font-size:22px}
  .sticker-win{padding:2px 14px 2px 8px}
  .sticker-win .stk{width:50px;height:50px}
  .numcard{height:54px}
  .numline span{width:28px;height:28px}
  .mult-grid span{height:23px}
  .cmp{font-size:17px}
  /* Итог Мухи: поле поменьше, чтобы с новым уровнем и наклейкой «Ещё раз» было видно */
  .fly-stage .board{width:min(84vw,330px,calc(100dvh - 400px));height:min(84vw,330px,calc(100dvh - 400px))}
  /* Муха перед стартом: поле поменьше, чтобы «Начать» и темп были видны сразу */
  .ov-center:has(> [data-act="flyStart"]) .board{width:min(84vw,330px,calc(100dvh - 400px));height:min(84vw,330px,calc(100dvh - 400px))}
}
/* ---------- Уменьшенное движение ----------
   Этот блок обязан стоять ПОСЛЕДНИМ: при равной силе селекторов
   побеждает правило, которое ниже. Стоял бы выше — анимации,
   описанные после него, продолжали бы играть. */
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .sch-cell.hit,.sch-cell.nope,.sheet.enter,.ov-center .result,.ov-center .big-hand{animation:none}
  .kid.yay .bird,.star,.sticker-win .stk,.kid-stk .stk{animation:none}
  .tick path,.stamp circle,.stamp path{animation:none;stroke-dashoffset:0}
  .flyart .wl,.flyart .wr{animation:none}
  .flyart .wl{transform:rotate(-24deg)}.flyart .wr{transform:rotate(24deg)}
  .cell-fly.away{animation:none;opacity:.35}
  .sch-cell.nope{background:#F2F4F8}
  .snd.nope{animation:none;background:#F2F4F8}
  .mult-opt.nope{animation:none;background:#F2F4F8}
  .cnt-obj b.new{animation:none}
  .cnt-key.nope,.cnt-grp.nope{animation:none;background:#F2F4F8}
  .pic-btn.nope,.abc-btn.nope{animation:none;background:#F2F4F8}
  .mg-syl .c,.mg-syl.rev .c,.mg-arc{animation:none}
  .mg-opt.nope,.yn-btn.nope,.snt-opt.nope{animation:none;background:#F2F4F8}
  .plate.nope,.numcard.ask.nope{animation:none;background:#F2F4F8}   /* «Поровну»: тарелка ждёт; цепочка: «Ещё раз» */
}</style>
</head>
<body>
<div class="desk" aria-hidden="true"><div id="desk-left" class="desk-side left"></div><div id="desk-right" class="desk-side right"></div></div>
<main id="app" class="sheet"></main>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
